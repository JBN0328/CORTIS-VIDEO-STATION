<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CORTIS VIDEO STATION</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'Inter',
              '-apple-system',
              'BlinkMacSystemFont',
              'Segoe UI',
              'Roboto',
              'sans-serif'
            ]
          }
        }
      }
    }
  </script>

  <style>

    /* =========================================================
       基本樣式
    ========================================================= */

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* =========================================================
       Modal
    ========================================================= */

    .modal-backdrop {
      backdrop-filter: blur(8px);
    }

    /* =========================================================
       隱藏 Scrollbar
       但仍然可以左右滑動
    ========================================================= */

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* =========================================================
       月份橫向滑動
    ========================================================= */

    .month-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* =========================================================
       回到頂端按鈕
    ========================================================= */

    #backToTopBtn {
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        background-color 0.2s ease;
    }

    #backToTopBtn.hidden-button {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

  </style>
</head>


<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200"
>


  <!-- =========================================================
       HEADER
  ========================================================== -->

  <header
    class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800"
  >

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="flex items-center justify-between h-16 gap-4">

        <!-- Logo -->

        <div class="flex items-center gap-3 shrink-0">

          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/20"
          >
            C
          </div>

          <div>

            <h1
              class="font-bold text-lg tracking-tight leading-none text-slate-900 dark:text-white"
            >
              CORTIS VIDEO STATION
            </h1>

            <span
              class="text-xs text-slate-500 dark:text-slate-400 font-medium"
            >
              Video Archive 影音資料庫
            </span>

          </div>

        </div>


        <!-- Desktop Search -->

        <div class="hidden md:flex items-center flex-1 max-w-md mx-4">

          <div class="relative w-full">

            <i
              class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
            ></i>

            <input
              type="text"
              id="searchInput"
              placeholder="搜尋影片標題、標籤、關鍵字..."
              class="w-full pl-10 pr-10 py-2 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-full focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:outline-none transition-all placeholder-slate-400"
            >

            <button
              id="clearSearchBtn"
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs"
            >
              <i class="fa-solid fa-circle-xmark"></i>
            </button>

          </div>

        </div>


        <!-- Counter + Theme -->

        <div class="flex items-center gap-2">

          <span
            class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/50"
          >

            <i class="fa-solid fa-film text-[10px]"></i>

            <span id="totalCount">0</span>

            筆影音

          </span>


          <button
            id="themeToggleBtn"
            class="p-2.5 rounded-full text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            title="切換主題模式"
          >

            <i class="fa-solid fa-moon dark:hidden"></i>

            <i class="fa-solid fa-sun hidden dark:inline"></i>

          </button>

        </div>

      </div>


      <!-- Mobile Search -->

      <div class="md:hidden pb-3">

        <div class="relative w-full">

          <i
            class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
          ></i>

          <input
            type="text"
            id="searchInputMobile"
            placeholder="搜尋影片標題..."
            class="w-full pl-10 pr-10 py-2 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-full focus:ring-2 focus:ring-indigo-500 focus:outline-none placeholder-slate-400"
          >

        </div>

      </div>

    </div>

  </header>


  <!-- =========================================================
       MAIN CATEGORY
  ========================================================== -->

  <section
    class="bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800"
  >

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">

      <nav
        class="flex items-center gap-2.5 overflow-x-auto pb-1 hide-scrollbar"
        id="mainCategoryNav"
      >

        <!-- 全部 -->

        <button
          data-cat="all"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >

          <span
            class="w-3 h-3 rounded-full bg-white/30 flex items-center justify-center text-[8px]"
          >
            <i class="fa-solid fa-border-all"></i>
          </span>

          全部影片

        </button>


        <!-- 官方 -->

        <button
          data-cat="official"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >

          <span class="w-3 h-3 rounded-full bg-rose-500"></span>

          官方

        </button>


        <!-- 舞台 -->

        <button
          data-cat="stage"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >

          <span class="w-3 h-3 rounded-full bg-blue-500"></span>

          舞台

        </button>


        <!-- 節目 -->

        <button
          data-cat="variety"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >

          <span class="w-3 h-3 rounded-full bg-emerald-500"></span>

          節目

        </button>


        <!-- 其他 -->

        <button
          data-cat="other"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >

          <span class="w-3 h-3 rounded-full bg-violet-500"></span>

          其他

        </button>

      </nav>

    </div>

  </section>


  <!-- =========================================================
       FILTER TOOLBAR
  ========================================================== -->

  <section
    class="bg-white/60 dark:bg-slate-900/60 border-b border-slate-200/60 dark:border-slate-800/80 sticky top-16 z-20 backdrop-blur-sm py-2.5"
  >

    <div
      class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3"
    >

      <!-- 左側篩選 -->

      <div
        class="flex items-center gap-2 flex-wrap"
        id="subFiltersContainer"
      >

        <!-- 分類 -->

        <div
          id="subtypeFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="subtypeSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >

            <i class="fa-solid fa-layer-group mr-1"></i>

            分類:

          </label>

          <select
            id="subtypeSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >

            <option value="all">
              全部分類
            </option>

          </select>

        </div>


        <!-- 專輯 -->

        <div
          id="albumFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="albumSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >

            <i class="fa-solid fa-compact-disc mr-1"></i>

            專輯:

          </label>

          <select
            id="albumSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >

            <option value="all">
              全部專輯
            </option>

          </select>

        </div>


        <!-- 歌曲 -->

        <div
          id="songFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="songSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >

            <i class="fa-solid fa-music mr-1"></i>

            歌曲:

          </label>

          <select
            id="songSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >

            <option value="all">
              全部歌曲
            </option>

          </select>

        </div>

      </div>


      <!-- 右側 -->

      <div class="flex items-center gap-3 ml-auto flex-wrap">

        <!-- Member -->

        <div class="flex items-center gap-1.5">

          <label
            for="memberSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >

            <i class="fa-solid fa-user-group mr-1"></i>

            成員篩選:

          </label>

          <select
            id="memberSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >

            <option value="all">
              全部 (ALL)
            </option>

            <option value="GROUP">
              團體 (GROUP)
            </option>

            <option value="JAMES 趙雨凡">
              JAMES 趙雨凡
            </option>

            <option value="JUHOON 金主訓">
              JUHOON 金主訓
            </option>

            <option value="MARTIN 朴宇宙">
              MARTIN 朴宇宙
            </option>

            <option value="SEONGHYEON 嚴成玹">
              SEONGHYEON 嚴成玹
            </option>

            <option value="KEONHO 安乾鎬">
              KEONHO 安乾鎬
            </option>

          </select>

        </div>


        <!-- Sort -->

        <div class="flex items-center gap-1.5">

          <label
            for="sortSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >

            <i class="fa-solid fa-sort mr-1"></i>

            排序:

          </label>

          <select
            id="sortSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >

            <option value="desc">
              由新到舊
            </option>

            <option value="asc">
              由舊到新
            </option>

          </select>

        </div>

      </div>

    </div>

  </section>


  <!-- =========================================================
       MAIN
  ========================================================== -->

  <main
    class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"
  >

    <div class="flex flex-col md:flex-row gap-8 items-start relative">


      <!-- =====================================================
           DESKTOP TIMELINE
      ====================================================== -->

      <aside
        class="w-full md:w-56 shrink-0 md:sticky md:top-36 z-10 hidden md:block"
      >

        <div
          class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 shadow-sm"
        >

          <h3
            class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3 px-2"
          >

            <i class="fa-regular fa-calendar-check mr-1.5"></i>

            時間軸導覽

          </h3>


          <nav
            class="space-y-1 text-sm font-medium"
            id="sidebarTimelineNav"
          ></nav>

        </div>

      </aside>


      <!-- =====================================================
           CONTENT
      ====================================================== -->

      <section class="flex-1 w-full min-w-0">


        <!-- =================================================
             MOBILE TIMELINE
        ================================================== -->

        <div
          id="mobileTimeline"
          class="md:hidden mb-6"
        >

          <div
            class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-3 shadow-sm"
          >

            <div class="flex items-center gap-2 mb-2 px-1">

              <i
                class="fa-regular fa-calendar-check text-indigo-500"
              ></i>

              <span
                class="text-xs font-semibold text-slate-500 dark:text-slate-400"
              >
                時間軸導覽
              </span>

            </div>


            <div
              id="mobileTimelineNav"
              class="month-scroll hide-scrollbar flex gap-2 pb-1"
            ></div>

          </div>

        </div>


        <!-- =================================================
             FILTER STATUS
        ================================================== -->

        <div
          id="filterStatus"
          class="hidden mb-6 p-3 bg-indigo-50/80 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900/40 rounded-xl text-xs text-indigo-700 dark:text-indigo-300 flex items-center justify-between"
        >

          <span>

            <i class="fa-solid fa-filter mr-1.5"></i>

            已套用篩選條件

          </span>


          <button
            id="resetFilterBtn"
            class="font-semibold underline hover:text-indigo-900 dark:hover:text-indigo-100"
          >
            重設所有篩選
          </button>

        </div>


        <!-- =================================================
             VIDEO LIST
        ================================================== -->

        <div
          id="timelineContainer"
          class="space-y-10"
        ></div>


        <!-- =================================================
             EMPTY
        ================================================== -->

        <div
          id="emptyState"
          class="hidden text-center py-20 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-800"
        >

          <div
            class="w-16 h-16 mx-auto mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-2xl"
          >

            <i class="fa-solid fa-ghost"></i>

          </div>


          <h3
            class="text-lg font-semibold text-slate-700 dark:text-slate-200"
          >
            找不到符合條件的影音紀錄
          </h3>


          <p
            class="text-sm text-slate-400 mt-1 max-w-sm mx-auto"
          >
            請嘗試變更搜尋條件或重設成員篩選。
          </p>


          <button
            id="emptyResetBtn"
            class="mt-4 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition-all"
          >
            重設搜尋條件
          </button>

        </div>

      </section>

    </div>

  </main>


  <!-- =========================================================
       BACK TO TOP
  ========================================================== -->

  <button
    id="backToTopBtn"
    class="hidden-button fixed bottom-6 right-5 sm:right-8 z-40 w-11 h-11 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center"
    title="回到最上面"
    aria-label="回到最上面"
  >

    <i class="fa-solid fa-arrow-up"></i>

  </button>


  <!-- =========================================================
       VIDEO MODAL
  ========================================================== -->

  <div
    id="videoModal"
    class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6 md:p-10 modal-backdrop bg-slate-950/80 overflow-y-auto"
  >

    <div
      id="modalContainer"
      class="relative w-full max-w-4xl bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-slate-800 transform transition-all scale-95 opacity-0 my-auto"
    >


      <!-- Modal Header -->

      <div
        class="flex items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-900"
      >

        <div
          class="flex items-center gap-2 overflow-hidden pr-4"
        >

          <span
            id="modalCategoryBadge"
            class="px-2.5 py-0.5 rounded text-xs font-semibold text-white bg-indigo-600 shrink-0"
          >
            影片
          </span>


          <h3
            id="modalVideoTitle"
            class="font-bold text-white text-sm sm:text-base truncate"
          >
            載入中...
          </h3>

        </div>


        <button
          id="closeModalBtn"
          class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors shrink-0"
        >

          <i class="fa-solid fa-xmark"></i>

        </button>

      </div>


      <!-- Video -->

      <div class="relative w-full aspect-video bg-black">

        <iframe
          id="youtubeIframe"
          class="w-full h-full border-0"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>

      </div>


      <!-- Info -->

      <div
        class="p-5 max-h-60 overflow-y-auto space-y-4 bg-slate-950 text-xs text-slate-300"
      >

        <div
          class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800/80 pb-3"
        >

          <div
            class="flex items-center gap-4 text-slate-400"
          >

            <span id="modalVideoDate">
              <i class="fa-regular fa-calendar mr-1"></i>
            </span>


            <span id="modalVideoMembers">
              <i class="fa-regular fa-user mr-1"></i>
            </span>

          </div>


          <a
            id="modalExternalLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="text-indigo-400 hover:text-indigo-300 font-medium inline-flex items-center gap-1"
          >

            前往 YouTube 觀看

            <i
              class="fa-solid fa-arrow-up-right-from-square text-[10px]"
            ></i>

          </a>

        </div>


        <!-- Description -->

        <div
          id="modalDescriptionWrapper"
          class="hidden"
        >

          <h4
            class="font-bold text-slate-200 mb-1"
          >

            <i
              class="fa-solid fa-align-left mr-1.5 text-indigo-400"
            ></i>

            影片說明

          </h4>


          <p
            id="modalDescription"
            class="text-slate-400 leading-relaxed"
          ></p>

        </div>


        <!-- Timestamps -->

        <div
          id="modalTimestampsWrapper"
          class="hidden"
        >

          <h4
            class="font-bold text-slate-200 mb-2"
          >

            <i
              class="fa-regular fa-clock mr-1.5 text-indigo-400"
            ></i>

            時間戳記與精彩亮點

          </h4>


          <div
            id="modalTimestampsList"
            class="space-y-1.5 pl-1"
          ></div>

        </div>

      </div>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================== -->

  <script>

    /* =========================================================
       基本設定
    ========================================================= */

    const SUBTYPES = {

      official: [
        "MV",
        "八點檔",
        "練習室"
      ],

      stage: [
        "打歌舞台",
        "電台",
        "安可舞台",
        "專場",
        "大型演出"
      ],

      variety: [
        "訪問",
        "綜藝"
      ],

      other: [
        "花絮",
        "得獎感言"
      ]

    };


    /* =========================================================
       舞台專輯與歌曲
       
       這裡只是預設資料。
       實際顯示會以 video.json 裡面的 album / song
       自動建立選項。
    ========================================================= */

    const STAGE_ALBUMS = [
      "COLOR OUTSIDE THE LINES",
      "GREENGREEN",
      "COVER"
    ];


    const STAGE_SONGS = {

      "COLOR OUTSIDE THE LINES": [
        "GO!",
        "What You Want",
        "FaSHioN",
        "JoyRide",
        "Lullaby"
      ],

      "GREENGREEN": [
        "TNT",
        "REDRED",
        "ACAI",
        "YOUNGCREATORCREW",
        "Wassup",

    /* =========================================================

    ========================================================== */

    const GROUP_MEMBERS = [

    /* =========================================================
       初始化
    ========================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        initTheme();

        fetchVideoData();

        updateSubFilterUI();

        setupBackToTop();

      }
    );


    /* =========================================================
       Theme
    ========================================================== */

    function initTheme() {

      const themeToggleBtn =
        document.getElementById("themeToggleBtn");


      if (

        localStorage.theme === "dark" ||

        (
          !("theme" in localStorage) &&
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
        )

      ) {

        document.documentElement.classList.add("dark");

      } else {

        document.documentElement.classList.remove("dark");

      }


      themeToggleBtn.addEventListener(
        "click",
        () => {

          if (
            document.documentElement.classList.contains("dark")
          ) {

            document.documentElement.classList.remove("dark");

            localStorage.theme = "light";

          } else {

            document.documentElement.classList.add("dark");

            localStorage.theme = "dark";

          }

        }
      );

    }


    /* =========================================================
       讀取 video.json
    ========================================================== */

    async function fetchVideoData() {

      try {

        const response =
          await fetch("./video.json");


        if (!response.ok) {

          throw new Error(
            "無法載入 video.json"
          );

        }


        archiveData =
          await response.json();


        /*
         * 相容舊版 members 格式
         */

        archiveData =
          archiveData.map(item => {

            const members =
              Array.isArray(item.members)
                ? item.members
                : [];


            const isFullGroup =
              GROUP_MEMBERS.length === members.length &&
              GROUP_MEMBERS.every(
                member => members.includes(member)
              );


            if (isFullGroup) {

              return {
                ...item,
                members: ["GROUP"]
              };

            }


            return item;

          });


        renderTimeline();

      } catch (error) {

        console.error(
          "載入失敗:",
          error
        );


        timelineContainer.innerHTML = `

          <div
            class="text-center py-12 text-rose-500 font-semibold"
          >

            讀取 video.json 失敗，請確認檔案路徑。

          </div>

        `;

      }

    }


    /* =========================================================
       GROUP 判斷
    ========================================================== */

    function isGroupVideo(item) {

      if (
        !item ||
        !Array.isArray(item.members)
      ) {

        return false;

      }


      if (
        item.members.includes("GROUP")
      ) {

        return true;

      }


      return (
        GROUP_MEMBERS.length === item.members.length &&
        GROUP_MEMBERS.every(
          member => item.members.includes(member)
        )
      );

    }


    /* =========================================================
       成員篩選
    ========================================================== */

    function matchesMemberFilter(item) {

      if (
        currentMember === "all"
      ) {

        return true;

      }


      if (
        currentMember === "GROUP"
      ) {

        return isGroupVideo(item);

      }


      return (
        Array.isArray(item.members) &&
        item.members.includes(currentMember)
      );

    }


    /* =========================================================
       取得舞台專輯
       
       優先從 video.json 取得，
       沒有的話使用預設 STAGE_ALBUMS。
    ========================================================== */

    function getStageAlbums() {

      const albums =
        new Set();


      archiveData
        .filter(
          item => item.category === "stage"
        )
        .forEach(
          item => {

            if (item.album) {

              albums.add(item.album);

            }

          }
        );


      /*
       * 預設專輯也保留
       */

      STAGE_ALBUMS.forEach(
        album => albums.add(album)
      );


      return Array.from(albums);

    }


    /* =========================================================
       取得歌曲
       
       這裡非常重要：
       
       如果一個影片是：
       
       "song": ["REDRED", "ACAI"]
       
       那 REDRED 與 ACAI 都會被抓到。
    ========================================================== */

    function getStageSongs(album = "all") {

      const songs =
        new Set();


      archiveData
        .filter(
          item => item.category === "stage"
        )
        .forEach(
          item => {

            /*
             * album 篩選
             */

            if (
              album !== "all" &&
              item.album !== album
            ) {

              return;

            }


            /*
             * 支援：
             *
             * song: "REDRED"
             *
             * 以及：
             *
             * song: ["REDRED", "ACAI"]
             */

            if (
              Array.isArray(item.song)
            ) {

              item.song.forEach(
                song => {

                  if (song) {
                    songs.add(song);
                  }

                }
              );

            } else if (
              item.song
            ) {

              songs.add(item.song);

            }

          }
        );


      /*
       * 預設歌曲也補進去
       */

      if (
        album !== "all" &&
        STAGE_SONGS[album]
      ) {

        STAGE_SONGS[album].forEach(
          song => songs.add(song)
        );

      }


      return Array.from(songs);

    }


    /* =========================================================
       更新分類 / 專輯 / 歌曲 UI
    ========================================================== */

    function updateSubFilterUI() {

      currentSubtype = "all";

      currentAlbum = "all";

      currentSong = "all";


      subtypeSelect.value = "all";

      albumSelect.value = "all";

      songSelect.value = "all";


      /*
       * 全部
       */

      if (
        currentMainCategory === "all"
      ) {

        subtypeFilterWrapper.classList.add(
          "hidden"
        );

        subtypeFilterWrapper.classList.remove(
          "flex"
        );


        albumFilterWrapper.classList.add(
          "hidden"
        );

        albumFilterWrapper.classList.remove(
          "flex"
        );


        songFilterWrapper.classList.add(
          "hidden"
        );

        songFilterWrapper.classList.remove(
          "flex"
        );


        return;

      }


      /*
       * 所有主分類都可以有「分類」
       */

      subtypeFilterWrapper.classList.remove(
        "hidden"
      );

      subtypeFilterWrapper.classList.add(
        "flex"
      );


      const options =
        SUBTYPES[currentMainCategory] || [];


      subtypeSelect.innerHTML =

        `<option value="all">全部分類</option>` +

        options
          .map(
            opt =>
              `<option value="${opt}">${opt}</option>`
          )
          .join("");


      /*
       * 只有舞台才有：
       *
       * 專輯
       * 歌曲
       */

      if (
        currentMainCategory === "stage"
      ) {

        albumFilterWrapper.classList.remove(
          "hidden"
        );

        albumFilterWrapper.classList.add(
          "flex"
        );


        songFilterWrapper.classList.remove(
          "hidden"
        );

        songFilterWrapper.classList.add(
          "flex"
        );


        populateAlbumSelect();

        populateSongSelect();

      } else {

        albumFilterWrapper.classList.add(
          "hidden"
        );

        albumFilterWrapper.classList.remove(
          "flex"
        );


        songFilterWrapper.classList.add(
          "hidden"
        );

        songFilterWrapper.classList.remove(
          "flex"
        );

      }

    }


    /* =========================================================
       專輯 Select
    ========================================================== */

    function populateAlbumSelect() {

      const albums =
        getStageAlbums();


      albumSelect.innerHTML =
        `<option value="all">全部專輯</option>` +

        albums
          .map(
            album =>
              `<option value="${escapeHTML(album)}">${escapeHTML(album)}</option>`
          )
          .join("");

    }


    /* =========================================================
       歌曲 Select
    ========================================================== */

    function populateSongSelect() {

      const songs =
        getStageSongs(currentAlbum);


      songSelect.innerHTML =
        `<option value="all">全部歌曲</option>` +

        songs
          .map(
            song =>
              `<option value="${escapeHTML(song)}">${escapeHTML(song)}</option>`
          )
          .join("");

    }


    /* =========================================================
       HTML Escape
    ========================================================== */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       判斷影片是否包含歌曲
    ========================================================== */

    function itemHasSong(item, targetSong) {

      if (
        !targetSong ||
        targetSong === "all"
      ) {

        return true;

      }


      if (
        Array.isArray(item.song)
      ) {

        return item.song.includes(
          targetSong
        );

      }


      return item.song === targetSong;

    }


    /* =========================================================
       取得篩選後資料
    ========================================================== */

    function getFilteredData() {

      let filtered =
        archiveData.filter(
          item => {


            /*
             * 主分類
             */

            if (

              currentMainCategory !== "all" &&

              item.category !== currentMainCategory

            ) {

              return false;

            }


            /*
             * 搜尋
             */

            if (
              currentSearchQuery !== ""
            ) {

              const q =
                currentSearchQuery.toLowerCase();


              const matchTitle =
                item.title &&
                item.title
                  .toLowerCase()
                  .includes(q);


              const matchDesc =
                item.description &&
                item.description
                  .toLowerCase()
                  .includes(q);


              const matchTags =
                Array.isArray(item.tags) &&
                item.tags.some(
                  tag =>
                    String(tag)
                      .toLowerCase()
                      .includes(q)
                );


              const matchAlbum =
                item.album &&
                String(item.album)
                  .toLowerCase()
                  .includes(q);


              let matchSong = false;


              if (
                Array.isArray(item.song)
              ) {

                matchSong =
                  item.song.some(
                    song =>
                      String(song)
                        .toLowerCase()
                        .includes(q)
                  );

              } else if (
                item.song
              ) {

                matchSong =
                  String(item.song)
                    .toLowerCase()
                    .includes(q);

              }


              if (
                !matchTitle &&
                !matchDesc &&
                !matchTags &&
                !matchAlbum &&
                !matchSong
              ) {

                return false;

              }

            }


            /*
             * 分類
             */

            if (

              currentSubtype !== "all" &&

              item.subtype !== currentSubtype

            ) {

              return false;

            }


            /*
             * 舞台 → 專輯
             */

            if (

              currentMainCategory === "stage" &&

              currentAlbum !== "all" &&

              item.album !== currentAlbum

            ) {

              return false;

            }


            /*
             * 舞台 → 歌曲
             *
             * 支援單首或多首
             */

            if (

              currentMainCategory === "stage" &&

              currentSong !== "all" &&

              !itemHasSong(
                item,
                currentSong
              )

            ) {

              return false;

            }


            /*
             * 成員
             */

            if (
              !matchesMemberFilter(item)
            ) {

              return false;

            }


            return true;

          }
        );


      /*
       * 日期排序
       */

      filtered.sort(
        (a, b) => {

          const dateA =
            new Date(a.date);

          const dateB =
            new Date(b.date);


          return currentSortOrder === "desc"
            ? dateB - dateA
            : dateA - dateB;

        }
      );


      return filtered;

    }


    /* =========================================================
       月份分組
    ========================================================== */

    function groupDataByMonth(data) {

      const groups = {};


      data.forEach(
        item => {

          const dateObj =
            new Date(item.date);


          if (
            Number.isNaN(dateObj.getTime())
          ) {

            return;

          }


          const year =
            dateObj.getFullYear();


          const month =
            String(
              dateObj.getMonth() + 1
            ).padStart(2, "0");


          const key =
            `${year}.${month}`;


          if (!groups[key]) {

            groups[key] = [];

          }


          groups[key].push(item);

        }
      );


      return groups;

    }


    /* =========================================================
       年份分組
    ========================================================== */

    function groupMonthsByYear(monthKeys) {

      const years = {};


      monthKeys.forEach(
        key => {

          const [year, month] =
            key.split(".");


          if (!years[year]) {

            years[year] = [];

          }


          years[year].push(month);

        }
      );


      return years;

    }


    /* =========================================================
       Render Timeline
    ========================================================== */

    function renderTimeline() {

      const filteredData =
        getFilteredData();


      totalCountEl.textContent =
        filteredData.length;


      const isFiltered =

        currentSearchQuery !== "" ||

        currentSubtype !== "all" ||

        currentAlbum !== "all" ||

        currentSong !== "all" ||

        currentMember !== "all" ||

        currentMainCategory !== "all";


      filterStatus.classList.toggle(
        "hidden",
        !isFiltered
      );


      /*
       * 無資料
       */

      if (
        filteredData.length === 0
      ) {

        timelineContainer.innerHTML = "";

        sidebarTimelineNav.innerHTML = "";

        mobileTimelineNav.innerHTML = "";

        emptyState.classList.remove(
          "hidden"
        );

        return;

      }


      emptyState.classList.add(
        "hidden"
      );


      const groupedData =
        groupDataByMonth(
          filteredData
        );


      const monthKeys =
        Object.keys(groupedData)
          .sort(
            (a, b) => {

              const [ay, am] =
                a.split(".").map(Number);

              const [by, bm] =
                b.split(".").map(Number);


              const dateA =
                new Date(
                  ay,
                  am - 1,
                  1
                );

              const dateB =
                new Date(
                  by,
                  bm - 1,
                  1
                );


              return currentSortOrder === "desc"
                ? dateB - dateA
                : dateA - dateB;

            }
          );


      /*
       * Render Desktop Timeline
       */

      renderSidebarNav(
        monthKeys
      );


      /*
       * Render Mobile Timeline
       */

      renderMobileTimeline(
        monthKeys
      );


      /*
       * Render Video
       */

      let timelineHTML = "";


      monthKeys.forEach(
        monthKey => {

          const [year, month] =
            monthKey.split(".");


          const items =
            groupedData[monthKey];


          timelineHTML += `

            <div
              id="section-${monthKey}"
              class="scroll-mt-36"
            >

              <div
                class="flex items-center gap-3 mb-4 sticky top-28 z-10 bg-slate-50/90 dark:bg-slate-950/90 backdrop-blur-sm py-2"
              >

                <span
                  class="text-sm font-bold tracking-wider text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/80 px-3 py-1 rounded-lg border border-indigo-100 dark:border-indigo-900/50 whitespace-nowrap"
                >

                  ${year} 年 ${parseInt(month)} 月

                </span>


                <div
                  class="h-px bg-slate-200 dark:bg-slate-800 flex-1"
                ></div>


                <span
                  class="text-xs text-slate-400 font-normal whitespace-nowrap"
                >

                  ${items.length} 則影音

                </span>

              </div>


              <div class="space-y-4">

                ${items
                  .map(
                    item =>
                      createVideoCardHTML(item)
                  )
                  .join("")}

              </div>

            </div>

          `;

        }
      );


      timelineContainer.innerHTML =
        timelineHTML;


      attachCardListeners();

    }


    /* =========================================================
       Desktop Timeline
       
       只顯示年份 + 該年份實際存在的月份。
    ========================================================== */

    function renderSidebarNav(
      monthKeys
    ) {

      const years =
        groupMonthsByYear(
          monthKeys
        );


      const yearKeys =
        Object.keys(years)
          .sort(
            (a, b) =>
              currentSortOrder === "desc"
                ? Number(b) - Number(a)
                : Number(a) - Number(b)
          );


      sidebarTimelineNav.innerHTML =
        yearKeys
          .map(
            year => {

              const months =
                years[year];


              const sortedMonths =
                [...months].sort(
                  (a, b) => {

                    return currentSortOrder === "desc"
                      ? Number(b) - Number(a)
                      : Number(a) - Number(b);

                  }
                );


              return `

                <div
                  class="mb-2"
                >

                  <!-- 年份 -->

                  <a
                    href="#section-${year}.${sortedMonths[0]}"
                    class="flex items-center justify-between px-3 py-2 rounded-xl text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 transition-all font-bold"
                  >

                    <span class="flex items-center gap-2">

                      <i
                        class="fa-solid fa-calendar text-[11px] text-indigo-500"
                      ></i>

                      ${year}

                    </span>

                    <span
                      class="text-[10px] text-slate-400"
                    >

                      ${months.length} 月

                    </span>

                  </a>


                  <!-- 月份 -->

                  <div class="ml-2 mt-1 space-y-1">

                    ${sortedMonths
                      .map(
                        month => `

                          <a
                            href="#section-${year}.${month}"
                            class="sidebar-link flex items-center justify-between px-3 py-1.5 rounded-lg text-xs text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all"
                          >

                            <span class="flex items-center gap-2">

                              <i
                                class="fa-solid fa-circle text-[5px] text-indigo-400"
                              ></i>

                              ${year}.${month}

                            </span>

                          </a>

                        `
                      )
                      .join("")}

                  </div>

                </div>

              `;

            }
          )
          .join("");

    }


    /* =========================================================
       Mobile Timeline
       
       手機版只有一個時間軸。
       
       年份也保留，
       月份橫向滑動。
    ========================================================== */

    function renderMobileTimeline(
      monthKeys
    ) {

      const years =
        groupMonthsByYear(
          monthKeys
        );


      const yearKeys =
        Object.keys(years)
          .sort(
            (a, b) =>
              currentSortOrder === "desc"
                ? Number(b) - Number(a)
                : Number(a) - Number(b)
          );


      let html = "";


      yearKeys.forEach(
        year => {

          const months =
            [...years[year]].sort(
              (a, b) => {

                return currentSortOrder === "desc"
                  ? Number(b) - Number(a)
                  : Number(a) - Number(b);

              }
            );


          /*
           * 年份
           */

          html += `

            <a
              href="#section-${year}.${months[0]}"
              class="shrink-0 px-3 py-1.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/50 text-xs font-bold"
            >

              ${year}

            </a>

          `;


          /*
           * 月份
           */

          months.forEach(
            month => {

              html += `

                <a
                  href="#section-${year}.${month}"
                  class="shrink-0 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 text-xs font-medium transition-colors"
                >

                  ${parseInt(month)} 月

                </a>

              `;

            }
          );

        }
      );


      mobileTimelineNav.innerHTML =
        html;

    }


    /* =========================================================
       Video Card
    ========================================================== */

    function createVideoCardHTML(
      item
    ) {

      /*
       * 成員
       */

      const memberBadges =
        (item.members || [])
          .map(
            member => {

              if (
                member === "GROUP"
              ) {

                return `

                  <span
                    class="px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/50"
                  >

                    #團體 GROUP

                  </span>

                `;

              }


              return `

                <span
                  class="px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                >

                  #${escapeHTML(member)}

                </span>

              `;

            }
          )
          .join(" ");


      /*
       * Tags
       */

      const tagBadges =
        (item.tags || [])
          .map(
            tag => `

              <span
                class="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-900/40"
              >

                #${escapeHTML(tag)}

              </span>

            `
          )
          .join(" ");


      /*
       * Subtype
       */

      const subtypeTag =
        item.subtype
          ? `

            <span
              class="px-2 py-0.5 rounded text-[11px] font-semibold bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400"
            >

              ${escapeHTML(item.subtype)}

            </span>

          `
          : "";


      /*
       * Album
       */

      const albumTag =
        item.category === "stage" &&
        item.album

          ? `

            <span
              class="px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400"
            >

              💿 ${escapeHTML(item.album)}

            </span>

          `

          : "";


      /*
       * Song
       
       * 支援：
       *
       * "song": "REDRED"
       *
       * 或：
       *
       * "song": ["REDRED", "ACAI"]
       */

      let songTag = "";


      if (
        Array.isArray(item.song)
      ) {

        songTag =
          item.song
            .map(
              song => `

                <span
                  class="px-2 py-0.5 rounded text-[11px] font-semibold bg-violet-100 dark:bg-violet-950 text-violet-600 dark:text-violet-400"
                >

                  🎵 ${escapeHTML(song)}

                </span>

              `
            )
            .join("");

      } else if (
        item.song
      ) {

        songTag = `

          <span
            class="px-2 py-0.5 rounded text-[11px] font-semibold bg-violet-100 dark:bg-violet-950 text-violet-600 dark:text-violet-400"
          >

            🎵 ${escapeHTML(item.song)}

          </span>

        `;

      }


      /*
       * Thumbnail
       */

      const thumbnailUrl =
        `https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg`;


      return `

        <div
          class="group bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700/60 rounded-2xl p-3 sm:p-4 transition-all duration-200 shadow-sm hover:shadow-md flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4"
        >


          <div
            class="flex flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-4 min-w-0 flex-1"
          >


            <!-- Thumbnail -->

            <div
              class="relative w-full sm:w-44 aspect-video rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 shrink-0 group-hover:shadow-md transition-all"
            >

              <img
                src="${thumbnailUrl}"
                alt="${escapeHTML(item.title || "")}"
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                loading="lazy"
              >


              <div
                class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors flex items-center justify-center"
              >

                <div
                  class="w-8 h-8 rounded-full bg-white/90 text-slate-900 flex items-center justify-center shadow-md group-hover:scale-110 transition-transform"
                >

                  <i
                    class="fa-solid fa-play text-xs ml-0.5"
                  ></i>

                </div>

              </div>

            </div>


            <!-- Info -->

            <div
              class="min-w-0 space-y-2 flex-1"
            >

              <div
                class="flex flex-wrap items-center gap-1.5"
              >

                <span
                  class="text-xs font-bold text-slate-400 mr-1"
                >

                  <i
                    class="fa-regular fa-calendar-days mr-1"
                  ></i>

                  ${escapeHTML(item.date)}

                </span>


                ${subtypeTag}

                ${albumTag}

                ${songTag}

              </div>


              <h4
                class="font-bold text-slate-900 dark:text-slate-100 text-sm sm:text-base group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors line-clamp-2"
              >

                ${escapeHTML(item.title || "")}

              </h4>


              <div
                class="flex items-center gap-1.5 flex-wrap pt-0.5"
              >

                ${tagBadges}

                ${memberBadges}

              </div>

            </div>

          </div>


          <!-- Play -->

          <div
            class="shrink-0 flex items-center justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 dark:border-slate-800"
          >

            <button
              data-id="${escapeHTML(item.id)}"
              class="open-video-btn w-full sm:w-auto px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition-all flex items-center justify-center gap-2 shadow-sm shadow-indigo-500/20"
            >

              <i
                class="fa-solid fa-play text-[10px]"
              ></i>

              播放影片

            </button>

          </div>

        </div>

      `;

    }


    /* =========================================================
       Card Listeners
    ========================================================== */

    function attachCardListeners() {

      document
        .querySelectorAll(
          ".open-video-btn"
        )
        .forEach(
          btn => {

            btn.addEventListener(
              "click",
              e => {

                const videoId =
                  e.currentTarget.getAttribute(
                    "data-id"
                  );


                const videoData =
                  archiveData.find(
                    video =>
                      String(video.id) ===
                      String(videoId)
                  );


                if (videoData) {

                  openModal(
                    videoData
                  );

                }

              }
            );

          }
        );

    }


    /* =========================================================
       Modal
    ========================================================== */

    function openModal(data) {

      currentActiveYoutubeId =
        data.youtubeId;


      modalVideoTitle.textContent =
        data.title || "";


      modalVideoDate.innerHTML = `

        <i
          class="fa-regular fa-calendar mr-1"
        ></i>

        ${escapeHTML(data.date || "")}

      `;


      const modalMembers =
        (data.members || [])
          .map(
            member =>
              member === "GROUP"
                ? "團體 (GROUP)"
                : member
          )
          .join(", ");


      modalVideoMembers.innerHTML = `

        <i
          class="fa-regular fa-user mr-1"
        ></i>

        成員:
        ${escapeHTML(modalMembers)}

      `;


      /*
       * YouTube
       */

      youtubeIframe.src =
        `https://www.youtube-nocookie.com/embed/${data.youtubeId}?autoplay=1`;


      modalExternalLink.href =
        `https://www.youtube.com/watch?v=${data.youtubeId}`;


      /*
       * Description
       */

      if (
        data.description
      ) {

        modalDescription.textContent =
          data.description;

        modalDescriptionWrapper.classList.remove(
          "hidden"
        );

      } else {

        modalDescriptionWrapper.classList.add(
          "hidden"
        );

      }


      /*
       * Timestamps
       */

      if (

        data.timestamps &&

        data.timestamps.length > 0

      ) {

        modalTimestampsList.innerHTML =
          data.timestamps
            .map(
              ts => `

                <div
                  class="flex items-center gap-2.5 text-slate-300 hover:text-white transition-colors"
                >

                  <button
                    onclick="seekVideo(${Number(ts.seconds)})"
                    class="px-2 py-0.5 rounded bg-indigo-950/80 hover:bg-indigo-600 text-indigo-400 hover:text-white font-mono text-[11px] font-bold border border-indigo-800/50 transition-colors"
                  >

                    ${escapeHTML(ts.time)}

                  </button>


                  <span class="text-xs">

                    ${escapeHTML(ts.label)}

                  </span>

                </div>

              `
            )
            .join("");


        modalTimestampsWrapper.classList.remove(
          "hidden"
        );

      } else {

        modalTimestampsWrapper.classList.add(
          "hidden"
        );

      }


      /*
       * 顯示
       */

      videoModal.classList.remove(
        "hidden"
      );


      setTimeout(
        () => {

          modalContainer.classList.remove(
            "scale-95",
            "opacity-0"
          );

          modalContainer.classList.add(
            "scale-100",
            "opacity-100"
          );

        },
        10
      );


      document.body.style.overflow =
        "hidden";

    }


    /* =========================================================
       Timestamp Seek
    ========================================================== */

    window.seekVideo =
      function(seconds) {

        if (
          currentActiveYoutubeId
        ) {

          youtubeIframe.src =
            `https://www.youtube-nocookie.com/embed/${currentActiveYoutubeId}?autoplay=1&start=${seconds}`;

        }

      };


    /* =========================================================
       Close Modal
    ========================================================== */

    function closeModal() {

      modalContainer.classList.remove(
        "scale-100",
        "opacity-100"
      );

      modalContainer.classList.add(
        "scale-95",
        "opacity-0"
      );


      setTimeout(
        () => {

          videoModal.classList.add(
            "hidden"
          );

          youtubeIframe.src = "";

          currentActiveYoutubeId = "";

          document.body.style.overflow = "";

        },
        200
      );

    }


    /* =========================================================
       Back To Top
       
       注意：
       這個按鈕只有「點擊」才會回到最上面。
       不會因為滑動而自動捲動。
    ========================================================== */

    function setupBackToTop() {

      /*
       * 滑動只負責控制按鈕顯示 / 隱藏
       */

      window.addEventListener(
        "scroll",
        () => {

          if (
            window.scrollY > 500
          ) {

            backToTopBtn.classList.remove(
              "hidden-button"
            );

          } else {

            backToTopBtn.classList.add(
              "hidden-button"
            );

          }

        },
        {
          passive: true
        }
      );


      /*
       * 只有點擊才回頂端
       */

      backToTopBtn.addEventListener(
        "click",
        () => {

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );

    }


    /* =========================================================
       Event Listeners
    ========================================================== */

    function setupEventListeners() {


      /* =====================================================
         主分類
      ====================================================== */

      document
        .getElementById("mainCategoryNav")
        .addEventListener(
          "click",
          e => {

            const btn =
              e.target.closest(
                ".cat-nav-btn"
              );


            if (!btn) {
              return;
            }


            document
              .querySelectorAll(
                ".cat-nav-btn"
              )
              .forEach(
                b => {

                  b.className =
                    "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

                }
              );


            btn.className =
              "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";


            currentMainCategory =
              btn.getAttribute(
                "data-cat"
              );


            updateSubFilterUI();

            renderTimeline();

          }
        );


      /* =====================================================
         Search
      ====================================================== */

      const handleSearch =
        e => {

          currentSearchQuery =
            e.target.value.trim();


          clearSearchBtn.classList.toggle(
            "hidden",
            currentSearchQuery === ""
          );


          /*
           * 同步搜尋
           */

          if (
            e.target === searchInput
          ) {

            searchInputMobile.value =
              currentSearchQuery;

          }


          if (
            e.target === searchInputMobile
          ) {

            searchInput.value =
              currentSearchQuery;

          }


          renderTimeline();

        };


      searchInput.addEventListener(
        "input",
        handleSearch
      );


      searchInputMobile.addEventListener(
        "input",
        handleSearch
      );


      /* =====================================================
         Clear Search
      ====================================================== */

      clearSearchBtn.addEventListener(
        "click",
        () => {

          searchInput.value = "";

          searchInputMobile.value = "";

          currentSearchQuery = "";

          clearSearchBtn.classList.add(
            "hidden"
          );

          renderTimeline();

        }
      );


      /* =====================================================
         Subtype
      ====================================================== */

      subtypeSelect.addEventListener(
        "change",
        e => {

          currentSubtype =
            e.target.value;

          renderTimeline();

        }
      );


      /* =====================================================
         Album
         
         選專輯後：
         歌曲會只顯示該專輯的歌曲。
      ====================================================== */

      albumSelect.addEventListener(
        "change",
        e => {

          currentAlbum =
            e.target.value;


          /*
           * 換專輯時，
           * 歌曲重設為全部。
           */

          currentSong =
            "all";


          populateSongSelect();


          renderTimeline();

        }
      );


      /* =====================================================
         Song
      ====================================================== */

      songSelect.addEventListener(
        "change",
        e => {

          currentSong =
            e.target.value;

          renderTimeline();

        }
      );


      /* =====================================================
         Member
      ====================================================== */

      memberSelect.addEventListener(
        "change",
        e => {

          currentMember =
            e.target.value;

          renderTimeline();

        }
      );


      /* =====================================================
         Sort
      ====================================================== */

      sortSelect.addEventListener(
        "change",
        e => {

          currentSortOrder =
            e.target.value;

          renderTimeline();

        }
      );


      /* =====================================================
         Reset
      ====================================================== */

      resetFilterBtn.addEventListener(
        "click",
        resetAllFilters
      );


      emptyResetBtn.addEventListener(
        "click",
        resetAllFilters
      );


      /* =====================================================
         Modal
      ====================================================== */

      closeModalBtn.addEventListener(
        "click",
        closeModal
      );


      videoModal.addEventListener(
        "click",
        e => {

          if (
            e.target === videoModal
          ) {

            closeModal();

          }

        }
      );


      /* =====================================================
         ESC
      ====================================================== */

      document.addEventListener(
        "keydown",
        e => {

          if (

            e.key === "Escape" &&

            !videoModal.classList.contains(
              "hidden"
            )

          ) {

            closeModal();

          }

        }
      );

    }


    /* =========================================================
       Reset
    ========================================================== */

    function resetAllFilters() {

      currentMainCategory =
        "all";

      currentSearchQuery =
        "";

      currentSubtype =
        "all";

      currentAlbum =
        "all";

      currentSong =
        "all";

      currentMember =
        "all";

      currentSortOrder =
        "desc";


      /*
       * Main buttons
       */

      document
        .querySelectorAll(
          ".cat-nav-btn"
        )
        .forEach(
          b => {

            if (
              b.getAttribute(
                "data-cat"
              ) === "all"
            ) {

              b.className =
                "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

            } else {

              b.className =
                "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

            }

          }
        );


      /*
       * UI
       */

      searchInput.value = "";

      searchInputMobile.value = "";

      subtypeSelect.value = "all";

      albumSelect.value = "all";

      songSelect.value = "all";

      memberSelect.value = "all";

      sortSelect.value = "desc";


      clearSearchBtn.classList.add(
        "hidden"
      );


      updateSubFilterUI();

      renderTimeline();

    }

  </script>

</body>
</html>
