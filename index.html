<!DOCTYPE html>
<html lang="zh-TW" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CORTIS VIDEO STATION</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script>
    tailwind.config = {
      darkMode: 'class',

      theme: {
        extend: {
          fontFamily: {
            sans: [
              'Inter',
              '-apple-system',
              'BlinkMacSystemFont',
              'Segoe UI',
              'Roboto',
              'sans-serif'
            ]
          }
        }
      }
    };
  </script>

  <style>

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    html {
      scroll-behavior: smooth;
    }

    .modal-backdrop {
      backdrop-filter: blur(8px);
    }

    /*
     * 手機版月份橫向滑動
     */
    .month-scroll {
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .month-scroll::-webkit-scrollbar {
      display: none;
    }

    /*
     * 回到頂端按鈕動畫
     */
    #backToTopBtn {
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0.2s ease;
    }

  </style>

</head>


<body
  class="
    bg-slate-50
    dark:bg-slate-950
    text-slate-800
    dark:text-slate-100
    min-h-screen
    font-sans
    transition-colors
    duration-200
  "
>


<!-- =========================================================
     HEADER
========================================================= -->

<header
  class="
    sticky
    top-0
    z-30
    bg-white/80
    dark:bg-slate-900/80
    backdrop-blur-md
    border-b
    border-slate-200/80
    dark:border-slate-800
  "
>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="flex items-center justify-between h-16 gap-4">

      <!-- Logo -->

      <div class="flex items-center gap-3 shrink-0">

        <div
          class="
            w-10
            h-10
            rounded-xl
            bg-gradient-to-tr
            from-indigo-600
            to-violet-500
            flex
            items-center
            justify-center
            text-white
            font-bold
            text-xl
            shadow-lg
            shadow-indigo-500/20
          "
        >
          C
        </div>

        <div>

          <h1
            class="
              font-bold
              text-lg
              tracking-tight
              leading-none
              text-slate-900
              dark:text-white
            "
          >
            CORTIS VIDEO STATION
          </h1>

          <span
            class="
              text-xs
              text-slate-500
              dark:text-slate-400
              font-medium
            "
          >
            Video Archive 影音資料庫
          </span>

        </div>

      </div>


      <!-- Desktop Search -->

      <div class="hidden md:flex items-center flex-1 max-w-md mx-4">

        <div class="relative w-full">

          <i
            class="
              fa-solid
              fa-magnifying-glass
              absolute
              left-3.5
              top-1/2
              -translate-y-1/2
              text-slate-400
              text-sm
            "
          ></i>

          <input
            type="text"
            id="searchInput"
            placeholder="搜尋影片標題、標籤、關鍵字..."
            class="
              w-full
              pl-10
              pr-10
              py-2
              text-sm
              bg-slate-100
              dark:bg-slate-800
              border-none
              rounded-full
              focus:ring-2
              focus:ring-indigo-500
              focus:outline-none
              transition-all
              placeholder-slate-400
            "
          >

          <button
            id="clearSearchBtn"
            class="
              hidden
              absolute
              right-3
              top-1/2
              -translate-y-1/2
              text-slate-400
              hover:text-slate-600
              dark:hover:text-slate-200
              text-xs
            "
          >
            <i class="fa-solid fa-circle-xmark"></i>
          </button>

        </div>

      </div>


      <!-- Right -->

      <div class="flex items-center gap-2">

        <span
          class="
            hidden
            sm:inline-flex
            items-center
            gap-1.5
            px-3
            py-1
            rounded-full
            text-xs
            font-semibold
            bg-indigo-50
            dark:bg-indigo-950/60
            text-indigo-600
            dark:text-indigo-400
            border
            border-indigo-100
            dark:border-indigo-900/50
          "
        >

          <i class="fa-solid fa-film text-[10px]"></i>

          <span id="totalCount">0</span>

          筆影音

        </span>


        <button
          id="themeToggleBtn"
          class="
            p-2.5
            rounded-full
            text-slate-500
            dark:text-slate-400
            hover:bg-slate-100
            dark:hover:bg-slate-800
            transition-colors
          "
          title="切換主題模式"
        >

          <i class="fa-solid fa-moon dark:hidden"></i>

          <i class="fa-solid fa-sun hidden dark:inline"></i>

        </button>

      </div>

    </div>


    <!-- Mobile Search -->

    <div class="md:hidden pb-3">

      <div class="relative w-full">

        <i
          class="
            fa-solid
            fa-magnifying-glass
            absolute
            left-3.5
            top-1/2
            -translate-y-1/2
            text-slate-400
            text-sm
          "
        ></i>

        <input
          type="text"
          id="searchInputMobile"
          placeholder="搜尋影片標題..."
          class="
            w-full
            pl-10
            pr-10
            py-2
            text-sm
            bg-slate-100
            dark:bg-slate-800
            border-none
            rounded-full
            focus:ring-2
            focus:ring-indigo-500
            focus:outline-none
            placeholder-slate-400
          "
        >

      </div>

    </div>

  </div>

</header>



<!-- =========================================================
     MAIN CATEGORY
========================================================= -->

<section
  class="
    bg-white
    dark:bg-slate-900
    border-b
    border-slate-200/80
    dark:border-slate-800
  "
>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">

    <nav
      id="mainCategoryNav"
      class="
        flex
        items-center
        gap-2.5
        overflow-x-auto
        pb-1
        sm:pb-0
      "
    >

      <button
        data-cat="all"
        class="
          cat-nav-btn
          px-5
          py-2.5
          rounded-xl
          text-xs
          font-bold
          bg-indigo-600
          text-white
          shadow-md
          shadow-indigo-500/20
          transition-all
          duration-200
          flex
          items-center
          gap-2
          whitespace-nowrap
        "
      >

        <span
          class="
            w-3
            h-3
            rounded-full
            bg-white/30
            flex
            items-center
            justify-center
            text-[8px]
          "
        >
          <i class="fa-solid fa-border-all"></i>
        </span>

        全部影片

      </button>


      <button
        data-cat="official"
        class="
          cat-nav-btn
          px-5
          py-2.5
          rounded-xl
          text-xs
          font-semibold
          bg-slate-100/90
          dark:bg-slate-800/90
          text-slate-600
          dark:text-slate-300
          hover:bg-slate-200/70
          dark:hover:bg-slate-700/70
          transition-all
          duration-200
          flex
          items-center
          gap-2
          whitespace-nowrap
        "
      >

        <span class="w-3 h-3 rounded-full bg-rose-500"></span>

        官方

      </button>


      <button
        data-cat="stage"
        class="
          cat-nav-btn
          px-5
          py-2.5
          rounded-xl
          text-xs
          font-semibold
          bg-slate-100/90
          dark:bg-slate-800/90
          text-slate-600
          dark:text-slate-300
          hover:bg-slate-200/70
          dark:hover:bg-slate-700/70
          transition-all
          duration-200
          flex
          items-center
          gap-2
          whitespace-nowrap
        "
      >

        <span class="w-3 h-3 rounded-full bg-blue-500"></span>

        舞台

      </button>


      <button
        data-cat="variety"
        class="
          cat-nav-btn
          px-5
          py-2.5
          rounded-xl
          text-xs
          font-semibold
          bg-slate-100/90
          dark:bg-slate-800/90
          text-slate-600
          dark:text-slate-300
          hover:bg-slate-200/70
          dark:hover:bg-slate-700/70
          transition-all
          duration-200
          flex
          items-center
          gap-2
          whitespace-nowrap
        "
      >

        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>

        節目

      </button>


      <button
        data-cat="other"
        class="
          cat-nav-btn
          px-5
          py-2.5
          rounded-xl
          text-xs
          font-semibold
          bg-slate-100/90
          dark:bg-slate-800/90
          text-slate-600
          dark:text-slate-300
          hover:bg-slate-200/70
          dark:hover:bg-slate-700/70
          transition-all
          duration-200
          flex
          items-center
          gap-2
          whitespace-nowrap
        "
      >

        <span class="w-3 h-3 rounded-full bg-violet-500"></span>

        其他

      </button>

    </nav>

  </div>

</section>



<!-- =========================================================
     FILTER TOOLBAR
========================================================= -->

<section
  class="
    bg-white/60
    dark:bg-slate-900/60
    border-b
    border-slate-200/60
    dark:border-slate-800/80
    sticky
    top-16
    z-20
    backdrop-blur-sm
    py-2.5
  "
>

  <div
    class="
      max-w-7xl
      mx-auto
      px-4
      sm:px-6
      lg:px-8
      flex
      flex-wrap
      items-center
      justify-between
      gap-3
    "
  >

    <!-- Left Filters -->

    <div
      id="subFiltersContainer"
      class="
        flex
        items-center
        gap-2
        flex-wrap
      "
    >

      <!-- Stage Subtype -->

      <div
        id="subtypeFilterWrapper"
        class="hidden items-center gap-1.5"
      >

        <label
          for="subtypeSelect"
          class="
            text-xs
            text-slate-500
            dark:text-slate-400
            font-medium
            whitespace-nowrap
          "
        >

          <i class="fa-solid fa-layer-group mr-1"></i>

          分類:

        </label>


        <select
          id="subtypeSelect"
          class="
            text-xs
            bg-slate-100
            dark:bg-slate-800
            border-none
            rounded-lg
            py-1.5
            px-2.5
            focus:ring-2
            focus:ring-indigo-500
            dark:text-slate-200
            cursor-pointer
          "
        >

          <option value="all">
            全部分類
          </option>

        </select>

      </div>


      <!-- Album -->

      <div
        id="albumFilterWrapper"
        class="hidden items-center gap-1.5"
      >

        <label
          for="albumSelect"
          class="
            text-xs
            text-slate-500
            dark:text-slate-400
            font-medium
            whitespace-nowrap
          "
        >

          <i class="fa-solid fa-compact-disc mr-1"></i>

          專輯:

        </label>


        <select
          id="albumSelect"
          class="
            text-xs
            bg-slate-100
            dark:bg-slate-800
            border-none
            rounded-lg
            py-1.5
            px-2.5
            focus:ring-2
            focus:ring-indigo-500
            dark:text-slate-200
            cursor-pointer
            max-w-[220px]
          "
        >

          <option value="all">
            全部專輯
          </option>

        </select>

      </div>


      <!-- Song -->

      <div
        id="songFilterWrapper"
        class="hidden items-center gap-1.5"
      >

        <label
          for="songSelect"
          class="
            text-xs
            text-slate-500
            dark:text-slate-400
            font-medium
            whitespace-nowrap
          "
        >

          <i class="fa-solid fa-music mr-1"></i>

          歌曲:

        </label>


        <select
          id="songSelect"
          class="
            text-xs
            bg-slate-100
            dark:bg-slate-800
            border-none
            rounded-lg
            py-1.5
            px-2.5
            focus:ring-2
            focus:ring-indigo-500
            dark:text-slate-200
            cursor-pointer
            max-w-[220px]
          "
        >

          <option value="all">
            全部歌曲
          </option>

        </select>

      </div>

    </div>


    <!-- Right Filters -->

    <div
      class="
        flex
        items-center
        gap-3
        ml-auto
        flex-wrap
      "
    >

      <!-- Member -->

      <div class="flex items-center gap-1.5">

        <label
          for="memberSelect"
          class="
            text-xs
            text-slate-500
            dark:text-slate-400
            font-medium
            whitespace-nowrap
          "
        >

          <i class="fa-solid fa-user-group mr-1"></i>

          成員篩選:

        </label>


        <select
          id="memberSelect"
          class="
            text-xs
            bg-slate-100
            dark:bg-slate-800
            border-none
            rounded-lg
            py-1.5
            px-2.5
            focus:ring-2
            focus:ring-indigo-500
            dark:text-slate-200
            cursor-pointer
          "
        >

          <option value="all">
            全部 (ALL)
          </option>

          <option value="GROUP">
            團體 (GROUP)
          </option>

          <option value="JAMES 趙雨凡">
            JAMES 趙雨凡
          </option>

          <option value="JUHOON 金主訓">
            JUHOON 金主訓
          </option>

          <option value="MARTIN 朴宇宙">
            MARTIN 朴宇宙
          </option>

          <option value="SEONGHYEON 嚴成玹">
            SEONGHYEON 嚴成玹
          </option>

          <option value="KEONHO 安乾鎬">
            KEONHO 安乾鎬
          </option>

        </select>

      </div>


      <!-- Sort -->

      <div class="flex items-center gap-1.5">

        <label
          for="sortSelect"
          class="
            text-xs
            text-slate-500
            dark:text-slate-400
            font-medium
            whitespace-nowrap
          "
        >

          <i class="fa-solid fa-sort mr-1"></i>

          排序:

        </label>


        <select
          id="sortSelect"
          class="
            text-xs
            bg-slate-100
            dark:bg-slate-800
            border-none
            rounded-lg
            py-1.5
            px-2.5
            focus:ring-2
            focus:ring-indigo-500
            dark:text-slate-200
            cursor-pointer
          "
        >

          <option value="desc">
            由新到舊
          </option>

          <option value="asc">
            由舊到新
          </option>

        </select>

      </div>

    </div>

  </div>

</section>



<!-- =========================================================
     MAIN
========================================================= -->

<main
  class="
    max-w-7xl
    mx-auto
    px-4
    sm:px-6
    lg:px-8
    py-8
  "
>

  <div
    class="
      flex
      flex-col
      md:flex-row
      gap-8
      items-start
      relative
    "
  >


    <!-- =====================================================
         TIMELINE SIDEBAR
    ====================================================== -->

    <aside
      class="
        w-full
        md:w-56
        shrink-0
        md:sticky
        md:top-36
        z-10
      "
    >

      <div
        class="
          bg-white
          dark:bg-slate-900
          border
          border-slate-200/80
          dark:border-slate-800
          rounded-2xl
          p-4
          shadow-sm
        "
      >

        <h3
          class="
            text-xs
            font-semibold
            text-slate-400
            dark:text-slate-500
            uppercase
            tracking-wider
            mb-3
            px-2
          "
        >

          <i class="fa-regular fa-calendar-check mr-1.5"></i>

          時間軸導覽

        </h3>


        <!--
          年份 / 月份導覽

          桌面：
          25年
            01 02 03 ...

          26年
            01 02 03 ...

          手機：
          一樣只有一個時間軸區塊
        -->

        <nav
          id="sidebarTimelineNav"
          class="space-y-4"
        ></nav>

      </div>

    </aside>



    <!-- =====================================================
         VIDEO CONTENT
    ====================================================== -->

    <section
      class="
        flex-1
        w-full
        min-w-0
      "
    >

      <!-- Filter Status -->

      <div
        id="filterStatus"
        class="
          hidden
          mb-6
          p-3
          bg-indigo-50/80
          dark:bg-indigo-950/30
          border
          border-indigo-100
          dark:border-indigo-900/40
          rounded-xl
          text-xs
          text-indigo-700
          dark:text-indigo-300
          items-center
          justify-between
        "
      >

        <span>

          <i class="fa-solid fa-filter mr-1.5"></i>

          已套用篩選條件

        </span>


        <button
          id="resetFilterBtn"
          class="
            font-semibold
            underline
            hover:text-indigo-900
            dark:hover:text-indigo-100
          "
        >
          重設所有篩選
        </button>

      </div>


      <!-- Timeline -->

      <div
        id="timelineContainer"
        class="space-y-10"
      ></div>


      <!-- Empty -->

      <div
        id="emptyState"
        class="
          hidden
          text-center
          py-20
          bg-white
          dark:bg-slate-900
          rounded-2xl
          border
          border-dashed
          border-slate-300
          dark:border-slate-800
        "
      >

        <div
          class="
            w-16
            h-16
            mx-auto
            mb-4
            rounded-full
            bg-slate-100
            dark:bg-slate-800
            flex
            items-center
            justify-center
            text-slate-400
            text-2xl
          "
        >

          <i class="fa-solid fa-ghost"></i>

        </div>


        <h3
          class="
            text-lg
            font-semibold
            text-slate-700
            dark:text-slate-200
          "
        >
          找不到符合條件的影音紀錄
        </h3>


        <p class="text-sm text-slate-400 mt-1 max-w-sm mx-auto">
          請嘗試變更搜尋條件或重設成員篩選。
        </p>


        <button
          id="emptyResetBtn"
          class="
            mt-4
            px-4
            py-2
            bg-indigo-600
            hover:bg-indigo-700
            text-white
            rounded-lg
            text-xs
            font-semibold
            transition-all
          "
        >
          重設搜尋條件
        </button>

      </div>

    </section>

  </div>

</main>



<!-- =========================================================
     BACK TO TOP
========================================================= -->

<button
  id="backToTopBtn"
  class="
    fixed
    bottom-6
    right-6
    z-40
    w-11
    h-11
    rounded-full
    bg-indigo-600
    hover:bg-indigo-700
    text-white
    shadow-lg
    shadow-indigo-500/30
    flex
    items-center
    justify-center
    opacity-0
    invisible
    translate-y-3
  "
  title="回到最上面"
  aria-label="回到最上面"
>

  <i class="fa-solid fa-arrow-up"></i>

</button>



<!-- =========================================================
     VIDEO MODAL
========================================================= -->

<div
  id="videoModal"
  class="
    fixed
    inset-0
    z-50
    hidden
    flex
    items-center
    justify-center
    p-4
    sm:p-6
    md:p-10
    modal-backdrop
    bg-slate-950/80
    overflow-y-auto
  "
>

  <div
    id="modalContainer"
    class="
      relative
      w-full
      max-w-4xl
      bg-slate-900
      rounded-2xl
      overflow-hidden
      shadow-2xl
      border
      border-slate-800
      transform
      transition-all
      scale-95
      opacity-0
      my-auto
    "
  >

    <!-- Modal Header -->

    <div
      class="
        flex
        items-center
        justify-between
        px-5
        py-4
        border-b
        border-slate-800
        bg-slate-900
      "
    >

      <div
        class="
          flex
          items-center
          gap-2
          overflow-hidden
          pr-4
        "
      >

        <span
          id="modalCategoryBadge"
          class="
            px-2.5
            py-0.5
            rounded
            text-xs
            font-semibold
            text-white
            bg-indigo-600
            shrink-0
          "
        >
          影片
        </span>


        <h3
          id="modalVideoTitle"
          class="
            font-bold
            text-white
            text-sm
            sm:text-base
            truncate
          "
        >
          載入中...
        </h3>

      </div>


      <button
        id="closeModalBtn"
        class="
          w-8
          h-8
          rounded-full
          bg-slate-800
          hover:bg-slate-700
          text-slate-400
          hover:text-white
          flex
          items-center
          justify-center
          transition-colors
          shrink-0
        "
      >

        <i class="fa-solid fa-xmark"></i>

      </button>

    </div>


    <!-- Video -->

    <div class="relative w-full aspect-video bg-black">

      <iframe
        id="youtubeIframe"
        class="
          w-full
          h-full
          border-0
        "
        src=""
        allow="
          accelerometer;
          autoplay;

<script>

/* =========================================================
   基本設定
========================================================= */


/*

const SUBTYPES = {

  ]

};


/*
 * =========================================================

 *
 * 只有 category === "stage" 時會使用。
 *
 * 結構：
 *

 */

const STAGE_ALBUMS = {

  ],

  ]

};


/*
 * 團體成員
 */

const GROUP_MEMBERS = [

  "MARTIN 朴宇宙",
  "SEONGHYEON 嚴成玹",
  "KEONHO 安乾鎬"

];


let archiveData = [];

let currentMainCategory = 'all';

let currentSubtype = 'all';

let currentAlbum = 'all';

let currentSong = 'all';

let currentMember = 'all';

let currentSortOrder = 'desc';

let currentSearchQuery = '';

let currentActiveYoutubeId = '';



/* =========================================================
   DOM
========================================================= */

const timelineContainer =
  document.getElementById('timelineContainer');

const sidebarTimelineNav =
  document.getElementById('sidebarTimelineNav');

const searchInputMobile =

const subtypeFilterWrapper =

const subtypeSelect =

const albumFilterWrapper =

const albumSelect =

const songFilterWrapper =

const songSelect =

const memberSelect =

const sortSelect =

const totalCountEl =

const emptyState =

const emptyResetBtn =
  document.getElementById('emptyResetBtn');

const filterStatus =
  document.getElementById('filterStatus');

const resetFilterBtn =
  document.getElementById('resetFilterBtn');

const backToTopBtn =
  document.getElementById('backToTopBtn');



/* =========================================================
   MODAL DOM
========================================================= */

const videoModal =
  document.getElementById('videoModal');

const modalContainer =
  document.getElementById('modalContainer');

const closeModalBtn =
  document.getElementById('closeModalBtn');

const youtubeIframe =
  document.getElementById('youtubeIframe');

const modalVideoTitle =
  document.getElementById('modalVideoTitle');

const modalVideoDate =
  document.getElementById('modalVideoDate');

const modalVideoMembers =
  document.getElementById('modalVideoMembers');

const modalExternalLink =
  document.getElementById('modalExternalLink');

const modalDescriptionWrapper =
  document.getElementById('modalDescriptionWrapper');

const modalDescription =
  document.getElementById('modalDescription');

const modalTimestampsWrapper =
  document.getElementById('modalTimestampsWrapper');

const modalTimestampsList =
  document.getElementById('modalTimestampsList');



/* =========================================================
   初始化
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  () => {

    initTheme();

    fetchVideoData();

    setupEventListeners();

    updateSubFilterUI();

    setupBackToTop();

  }
);



/* =========================================================
   Theme
========================================================= */

function initTheme() {

  const themeToggleBtn =
    document.getElementById('themeToggleBtn');


  if (

    localStorage.theme === 'dark' ||

    (
      !('theme' in localStorage) &&
      window.matchMedia(
        '(prefers-color-scheme: dark)'
      ).matches
    )

  ) {

    document.documentElement.classList.add(
      'dark'
    );

  } else {

    document.documentElement.classList.remove(
      'dark'
    );

  }


  themeToggleBtn.addEventListener(
    'click',
    () => {

      if (
        document.documentElement.classList.contains(
          'dark'
        )
      ) {

        document.documentElement.classList.remove(
          'dark'
        );

        localStorage.theme =
          'light';

      } else {

        document.documentElement.classList.add(
          'dark'
        );

        localStorage.theme =
          'dark';

      }

    }
  );

}



/* =========================================================
   讀取 video.json
========================================================= */

async function fetchVideoData() {

  try {

    const response =
      await fetch('./video.json');


    if (!response.ok) {

      throw new Error(
        '無法載入 video.json'
      );

    }


    archiveData =
      await response.json();


    /*
     * 相容舊版 GROUP 格式
     */

    archiveData =
      archiveData.map(item => {

        const members =
          Array.isArray(item.members)
            ? item.members
            : [];


        const isFullGroup =

          GROUP_MEMBERS.length ===
          members.length &&

          GROUP_MEMBERS.every(
            member =>
              members.includes(member)
          );


        if (isFullGroup) {

          return {

            ...item,

            members: ["GROUP"]

          };

        }


        return item;

      });


    renderTimeline();

  } catch (error) {

    console.error(
      '載入失敗:',
      error
    );


    timelineContainer.innerHTML = `

      <div
        class="
          text-center
          py-12
          text-rose-500
          font-semibold
        "
      >

        讀取 video.json 失敗，
        請確認檔案路徑。

      </div>

    `;

  }

}



/* =========================================================
   GROUP 判斷
========================================================= */

function isGroupVideo(item) {

  if (
    !item ||
    !Array.isArray(item.members)
  ) {

    return false;

  }


  if (
    item.members.includes('GROUP')
  ) {

    return true;

  }


  return (

    GROUP_MEMBERS.length ===
    item.members.length &&

    GROUP_MEMBERS.every(
      member =>
        item.members.includes(member)
    )

  );

}



/* =========================================================
   成員篩選
========================================================= */

function matchesMemberFilter(item) {

  if (
    currentMember === 'all'
  ) {

    return true;

  }


  if (
    currentMember === 'GROUP'
  ) {

    return isGroupVideo(item);

  }


  return (

    Array.isArray(item.members) &&

    item.members.includes(
      currentMember
    )

  );

}



/* =========================================================
   更新分類 / 專輯 / 歌曲 UI
========================================================= */

function updateSubFilterUI() {

  /*
   * 每次切換主分類，
   * 重設舞台相關條件。
   */

  currentSubtype = 'all';

  currentAlbum = 'all';

  currentSong = 'all';


  subtypeSelect.value = 'all';


  /*
   * 預設全部隱藏
   */

  subtypeFilterWrapper.classList.add(
    'hidden'
  );

  subtypeFilterWrapper.classList.remove(
    'flex'
  );

  albumFilterWrapper.classList.add(
    'hidden'
  );

  albumFilterWrapper.classList.remove(
    'flex'
  );

  songFilterWrapper.classList.add(
    'hidden'
  );

  songFilterWrapper.classList.remove(
    'flex'
  );


  /*
   * 不是全部分類：
   * 顯示分類
   */

  if (
    currentMainCategory !== 'all'
  ) {

    subtypeFilterWrapper.classList.remove(
      'hidden'
    );

    subtypeFilterWrapper.classList.add(
      'flex'
    );


    const options =
      SUBTYPES[currentMainCategory] || [];


    subtypeSelect.innerHTML =

      `<option value="all">全部分類</option>` +

      options
        .map(
          opt =>
            `<option value="${opt}">
              ${opt}
            </option>`
        )
        .join('');

  }


  /*
   * =======================================================
   * 只有舞台才顯示：
   *
   * 分類
   * 專輯
   * 歌曲
   * =======================================================
   */

  if (
    currentMainCategory === 'stage'
  ) {

    /*
     * 專輯
     */

    albumFilterWrapper.classList.remove(
      'hidden'
    );

    albumFilterWrapper.classList.add(
      'flex'
    );


    albumSelect.innerHTML =

      `<option value="all">
        全部專輯
      </option>` +

      Object.keys(STAGE_ALBUMS)
        .map(
          album =>
            `<option value="${escapeHtml(album)}">
              ${escapeHtml(album)}
            </option>`
        )
        .join('');


    albumSelect.value =
      'all';


    /*
     * 歌曲
     *
     * 一開始顯示全部歌曲。
     */

    songFilterWrapper.classList.remove(
      'hidden'
    );

    songFilterWrapper.classList.add(
      'flex'
    );


    updateSongOptions();

  }

}



/* =========================================================
   更新歌曲選單
========================================================= */

function updateSongOptions() {

  let songs = [];


  /*
   * 沒選專輯
   *
   * → 顯示三張專輯的所有歌曲
   */

  if (
    currentAlbum === 'all'
  ) {

    Object.values(
      STAGE_ALBUMS
    ).forEach(
      albumSongs => {

        songs.push(
          ...albumSongs
        );

      }
    );

  }

  /*
   * 有選專輯
   *
   * → 只顯示該專輯歌曲
   */

  else {

    songs =
      STAGE_ALBUMS[
        currentAlbum
      ] || [];

  }


  /*
   * 去除重複
   */

  songs =
    [...new Set(songs)];


  /*
   * 產生選項
   */

  songSelect.innerHTML =

    `<option value="all">
      全部歌曲
    </option>` +

    songs
      .map(
        song =>
          `<option value="${escapeHtml(song)}">
            ${escapeHtml(song)}
          </option>`
      )
      .join('');


  /*
   * 保留原本歌曲條件
   * 如果換專輯後原歌曲不存在，
   * 就自動回到全部。
   */

  if (
    currentSong !== 'all' &&
    !songs.includes(currentSong)
  ) {

    currentSong =
      'all';

  }


  songSelect.value =
    currentSong;

}



/* =========================================================
   HTML Escape
========================================================= */

function escapeHtml(value) {

  if (
    value === undefined ||
    value === null
  ) {

    return '';

  }


  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}



/* =========================================================
   取得篩選後資料
========================================================= */

function getFilteredData() {

  let filtered =
    archiveData.filter(
      item => {


        /*
         * 主分類
         */

        if (

          currentMainCategory !==
          'all' &&

          item.category !==
          currentMainCategory

        ) {

          return false;

        }


        /*
         * 搜尋
         */

        if (
          currentSearchQuery !== ''
        ) {

          const q =
            currentSearchQuery.toLowerCase();


          const matchTitle =

            item.title &&

            item.title
              .toLowerCase()
              .includes(q);


          const matchDesc =

            item.description &&

            item.description
              .toLowerCase()
              .includes(q);


          const matchTags =

            item.tags &&

            item.tags.some(
              tag =>
                tag
                  .toLowerCase()
                  .includes(q)
            );


          const matchAlbum =

            item.album &&

            item.album
              .toLowerCase()
              .includes(q);


          const matchSongs =

            Array.isArray(item.songs) &&

            item.songs.some(
              song =>
                song
                  .toLowerCase()
                  .includes(q)
            );


          if (

            !matchTitle &&
            !matchDesc &&
            !matchTags &&
            !matchAlbum &&
            !matchSongs

          ) {

            return false;

          }

        }


        /*
         * 分類
         */

        if (

          currentSubtype !==
          'all' &&

          item.subtype !==
          currentSubtype

        ) {

          return false;

        }


        /*
         * ===================================================
         * 舞台專輯
         * ===================================================
         */

        if (
          currentMainCategory ===
          'stage'
        ) {


          /*
           * 專輯
           */

          if (

            currentAlbum !==
            'all' &&

            item.album !==
            currentAlbum

          ) {

            return false;

          }


          /*
           * 歌曲
           *
           * 注意：
           *
           * item.songs 是陣列。
           *
           * 例如：
           *
           * songs: [
           *   "REDRED",
           *   "ACAI"
           * ]
           *
           * 篩選 REDRED → 找得到
           *
           * 篩選 ACAI → 也找得到
           */

          if (
            currentSong !==
            'all'
          ) {

            const itemSongs =
              Array.isArray(item.songs)
                ? item.songs
                : [];


            /*
             * 相容舊格式：
             *
             * 如果以前寫：
             *
             * "song": "REDRED"
             *
             * 也可以正常運作。
             */

            if (
              itemSongs.length === 0 &&
              item.song
            ) {

              if (
                item.song !==
                currentSong
              ) {

                return false;

              }

            }

            else if (
              !itemSongs.includes(
                currentSong
              )
            ) {

              return false;

            }

          }

        }


        /*
         * 成員
         */

        if (
          !matchesMemberFilter(item)
        ) {

          return false;

        }


        return true;

      }
    );


  /*
   * 日期排序
   */

  filtered.sort(
    (a, b) => {

      const dateA =
        new Date(a.date);

      const dateB =
        new Date(b.date);


      return currentSortOrder === 'desc'

        ? dateB - dateA

        : dateA - dateB;

    }
  );


  return filtered;

}



/* =========================================================
   按月份分組
========================================================= */

function groupDataByMonth(data) {

  const groups = {};


  data.forEach(
    item => {

      const dateObj =
        new Date(item.date);


      const year =
        dateObj.getFullYear();


      const month =
        String(
          dateObj.getMonth() + 1
        ).padStart(
          2,
          '0'
        );


      const key =
        `${year}.${month}`;


      if (!groups[key]) {

        groups[key] = [];

      }


      groups[key].push(item);

    }
  );


  return groups;

}



/* =========================================================
   Render Timeline
========================================================= */

function renderTimeline() {

  const filteredData =
    getFilteredData();


  totalCountEl.textContent =
    filteredData.length;


  const isFiltered =

    currentSearchQuery !== '' ||

    currentSubtype !== 'all' ||

    currentAlbum !== 'all' ||

    currentSong !== 'all' ||

    currentMember !== 'all' ||

    currentMainCategory !== 'all';


  filterStatus.classList.toggle(
    'hidden',
    !isFiltered
  );


  /*
   * 沒資料
   */

  if (
    filteredData.length === 0
  ) {

    timelineContainer.innerHTML = '';

    sidebarTimelineNav.innerHTML = '';

    emptyState.classList.remove(
      'hidden'
    );

    return;

  }


  emptyState.classList.add(
    'hidden'
  );


  const groupedData =
    groupDataByMonth(
      filteredData
    );


  renderSidebarNav(
    Object.keys(groupedData)
  );


  let timelineHTML = '';


  Object.keys(groupedData)
    .forEach(
      monthKey => {


        const [
          year,
          month
        ] =
          monthKey.split('.');


        const items =
          groupedData[
            monthKey
          ];


        timelineHTML += `

          <div
            id="section-${monthKey}"
            class="scroll-mt-36"
          >

            <div
              class="
                flex
                items-center
                gap-3
                mb-4
                sticky
                top-28
                z-10
                bg-slate-50/90
                dark:bg-slate-950/90
                backdrop-blur-sm
                py-2
              "
            >

              <span
                class="
                  text-sm
                  font-bold
                  tracking-wider
                  text-indigo-600
                  dark:text-indigo-400
                  bg-indigo-50
                  dark:bg-indigo-950/80
                  px-3
                  py-1
                  rounded-lg
                  border
                  border-indigo-100
                  dark:border-indigo-900/50
                "
              >

                ${year} 年
                ${parseInt(month)}
                月

              </span>


              <div
                class="
                  h-px
                  bg-slate-200
                  dark:bg-slate-800
                  flex-1
                "
              ></div>


              <span
                class="
                  text-xs
                  text-slate-400
                  font-normal
                "
              >

                ${items.length}
                則影音

              </span>

            </div>


            <div class="space-y-4">

              ${items
                .map(
                  item =>
                    createVideoCardHTML(
                      item
                    )
                )
                .join('')}

            </div>

          </div>

        `;

      }
    );


  timelineContainer.innerHTML =
    timelineHTML;


  attachCardListeners();

}



/* =========================================================
   時間軸 Sidebar
========================================================= */

function renderSidebarNav(
  monthKeys
) {

  /*
   * 依年份整理
   */

  const yearGroups = {};


  monthKeys.forEach(
    key => {

      const [
        year,
        month
      ] =
        key.split('.');


      if (!yearGroups[year]) {

        yearGroups[year] = [];

      }


      yearGroups[year].push(
        month
      );

    }
  );


  /*
   * 年份排序
   */

  const years =
    Object.keys(
      yearGroups
    ).sort(
      (a, b) =>
        Number(b) -
        Number(a)
    );


  sidebarTimelineNav.innerHTML =

    years
      .map(
        (year, yearIndex) => {

          const months =
            yearGroups[year];


          /*
           * 月份排序
           */

          months.sort(
            (a, b) =>
              Number(a) -
              Number(b)
          );


          /*
           * 年份完整按鈕
           *
           * 點年份 → 跳到該年份第一個月份
           */

          const firstMonth =
            months[0];


          return `

            <div
              class="
                timeline-year
                space-y-2
              "
            >

              <!-- 年份 -->

              <a
                href="#section-${year}.${firstMonth}"
                class="
                  flex
                  items-center
                  justify-between
                  px-3
                  py-2
                  rounded-xl
                  text-slate-700
                  dark:text-slate-200
                  hover:bg-slate-100
                  dark:hover:bg-slate-800/80
                  transition-all
                  font-bold
                  text-sm
                "
              >

                <span
                  class="
                    flex
                    items-center
                    gap-2
                  "
                >

                  <i
                    class="
                      fa-solid
                      fa-calendar
                      text-indigo-500
                      text-xs
                    "
                  ></i>

                  ${year} 年

                </span>


                <i
                  class="
                    fa-solid
                    fa-chevron-right
                    text-[10px]
                    opacity-40
                  "
                ></i>

              </a>


              <!-- 月份 -->

              <div
                class="
                  month-scroll
                  flex
                  gap-1.5
                  px-2
                  pb-1
                "
              >

                ${months
                  .map(
                    month => `

                      <a
                        href="#section-${year}.${month}"
                        class="
                          shrink-0
                          min-w-[42px]
                          px-2
                          py-1.5
                          rounded-lg
                          text-[11px]
                          text-center
                          font-medium
                          text-slate-500
                          dark:text-slate-400
                          bg-slate-50
                          dark:bg-slate-800/60
                          hover:bg-indigo-50
                          dark:hover:bg-indigo-950/60
                          hover:text-indigo-600
                          dark:hover:text-indigo-400
                          transition-all
                        "
                      >

                        ${month}月

                      </a>

                    `
                  )
                  .join('')}

              </div>

            </div>

          `;

        }
      )
      .join('');

}



/* =========================================================
   影片卡片
========================================================= */

function createVideoCardHTML(
  item
) {


  /*
   * 成員
   */

  const memberBadges =

    (item.members || [])
      .map(
        member => {

          if (
            member === 'GROUP'
          ) {

            return `

              <span
                class="
                  px-2
                  py-0.5
                  rounded
                  text-[11px]
                  font-bold
                  bg-indigo-50
                  dark:bg-indigo-950/60
                  text-indigo-600
                  dark:text-indigo-400
                  border
                  border-indigo-100
                  dark:border-indigo-900/50
                "
              >
                #團體 GROUP
              </span>

            `;

          }


          return `

            <span
              class="
                px-2
                py-0.5
                rounded
                text-[11px]
                font-medium
                bg-slate-100
                dark:bg-slate-800
                text-slate-600
                dark:text-slate-300
              "
            >
              #${escapeHtml(member)}
            </span>

          `;

        }
      )
      .join(' ');


  /*
   * Tags
   */

  const tagBadges =

    (item.tags || [])
      .map(
        tag => `

          <span
            class="
              px-2
              py-0.5
              rounded
              text-[11px]
              font-semibold
              bg-emerald-50
              dark:bg-emerald-950/50
              text-emerald-600
              dark:text-emerald-400
              border
              border-emerald-100
              dark:border-emerald-900/40
            "
          >
            #${escapeHtml(tag)}
          </span>

        `
      )
      .join(' ');


  /*
   * Subtype
   */

  const subtypeTag =

    item.subtype

      ? `

        <span
          class="
            px-2
            py-0.5
            rounded
            text-[11px]
            font-semibold
            bg-indigo-100
            dark:bg-indigo-950
            text-indigo-600
            dark:text-indigo-400
          "
        >

          ${escapeHtml(
            item.subtype
          )}

        </span>

      `

      : '';


  /*
   * =======================================================
   * Album Tag
   * =======================================================
   */

  const albumTag =

    item.category === 'stage' &&
    item.album

      ? `

        <span
          class="
            px-2
            py-0.5
            rounded
            text-[11px]
            font-semibold
            bg-violet-100
            dark:bg-violet-950
            text-violet-600
            dark:text-violet-400
          "
        >

          💿
          ${escapeHtml(
            item.album
          )}

        </span>

      `

      : '';


  /*
   * =======================================================
   * Song Tags
   * =======================================================
   */

  let songs = [];


  if (
    Array.isArray(item.songs)
  ) {

    songs =
      item.songs;

  }

  else if (
    item.song
  ) {

    songs =
      [item.song];

  }


  const songTags =

    item.category === 'stage' &&
    songs.length > 0

      ? songs
          .map(
            song => `

              <span
                class="
                  px-2
                  py-0.5
                  rounded
                  text-[11px]
                  font-semibold
                  bg-fuchsia-100
                  dark:bg-fuchsia-950
                  text-fuchsia-600
                  dark:text-fuchsia-400
                "
              >

                🎵
                ${escapeHtml(song)}

              </span>

            `
          )
          .join(' ')

      : '';


  /*
   * Thumbnail
   */

  const thumbnailUrl =

    `https://img.youtube.com/vi/${encodeURIComponent(
      item.youtubeId
    )}/hqdefault.jpg`;


  return `

    <div
      class="
        group
        bg-white
        dark:bg-slate-900
        border
        border-slate-200/80
        dark:border-slate-800
        hover:border-indigo-300
        dark:hover:border-indigo-700/60
        rounded-2xl
        p-3
        sm:p-4
        transition-all
        duration-200
        shadow-sm
        hover:shadow-md
        flex
        flex-col
        sm:flex-row
        items-stretch
        sm:items-center
        justify-between
        gap-4
      "
    >


      <!-- 左側 -->

      <div
        class="
          flex
          flex-col
          sm:flex-row
          items-start
          sm:items-center
          gap-3
          sm:gap-4
          min-w-0
          flex-1
        "
      >


        <!-- Thumbnail -->

        <div
          class="
            relative
            w-full
            sm:w-44
            aspect-video
            rounded-xl
            overflow-hidden
            bg-slate-100
            dark:bg-slate-800
            shrink-0
            group-hover:shadow-md
            transition-all
          "
        >

          <img
            src="${thumbnailUrl}"
            alt="${escapeHtml(item.title)}"
            class="
              w-full
              h-full
              object-cover
              group-hover:scale-105
              transition-transform
              duration-300
            "
            loading="lazy"
          >


          <div
            class="
              absolute
              inset-0
              bg-black/20
              group-hover:bg-black/10
              transition-colors
              flex
              items-center
              justify-center
            "
          >

            <div
              class="
                w-8
                h-8
                rounded-full
                bg-white/90
                text-slate-900
                flex
                items-center
                justify-center
                shadow-md
                group-hover:scale-110
                transition-transform
              "
            >

              <i
                class="
                  fa-solid
                  fa-play
                  text-xs
                  ml-0.5
                "
              ></i>

            </div>

          </div>

        </div>


        <!-- Information -->

        <div
          class="
            min-w-0
            space-y-2
            flex-1
          "
        >


          <!-- Date / subtype / album / song -->

          <div
            class="
              flex
              flex-wrap
              items-center
              gap-1.5
            "
          >

            <span
              class="
                text-xs
                font-bold
                text-slate-400
                mr-1
              "
            >

              <i
                class="
                  fa-regular
                  fa-calendar-days
                  mr-1
                "
              ></i>

              ${escapeHtml(
                item.date
              )}

            </span>


            ${subtypeTag}

            ${albumTag}

            ${songTags}

          </div>


          <!-- Title -->

          <h4
            class="
              font-bold
              text-slate-900
              dark:text-slate-100
              text-sm
              sm:text-base
              group-hover:text-indigo-600
              dark:group-hover:text-indigo-400
              transition-colors
              line-clamp-2
            "
          >

            ${escapeHtml(
              item.title
            )}

          </h4>


          <!-- Tags / Members -->

          <div
            class="
              flex
              items-center
              gap-1.5
              flex-wrap
              pt-0.5
            "
          >

            ${tagBadges}

            ${memberBadges}

          </div>

        </div>

      </div>


      <!-- Play Button -->

      <div
        class="
          shrink-0
          flex
          items-center
          justify-end
          border-t
          sm:border-t-0
          pt-3
          sm:pt-0
          border-slate-100
          dark:border-slate-800
        "
      >

        <button
          data-id="${escapeHtml(item.id)}"
          class="
            open-video-btn
            w-full
            sm:w-auto
            px-4
            py-2.5
            rounded-xl
            bg-indigo-600
            hover:bg-indigo-700
            text-white
            font-semibold
            text-xs
            transition-all
            flex
            items-center
            justify-center
            gap-2
            shadow-sm
            shadow-indigo-500/20
          "
        >

          <i
            class="
              fa-solid
              fa-play
              text-[10px]
            "
          ></i>

          播放影片

        </button>

      </div>

    </div>

  `;

}



/* =========================================================
   Card Listeners
========================================================= */

function attachCardListeners() {

  document
    .querySelectorAll(
      '.open-video-btn'
    )
    .forEach(
      btn => {

        btn.addEventListener(
          'click',
          e => {

            const videoId =
              e.currentTarget
                .getAttribute(
                  'data-id'
                );


            const videoData =
              archiveData.find(
                video =>
                  String(video.id) ===
                  String(videoId)
              );


            if (videoData) {

              openModal(
                videoData
              );

            }

          }
        );

      }
    );

}



/* =========================================================
   Open Modal
========================================================= */

function openModal(data) {

  currentActiveYoutubeId =
    data.youtubeId;


  modalVideoTitle.textContent =
    data.title;


  modalVideoDate.innerHTML = `

    <i
      class="
        fa-regular
        fa-calendar
        mr-1
      "
    ></i>

    ${escapeHtml(
      data.date
    )}

  `;


  /*
   * 成員
   */

  const modalMembers =

    (data.members || [])
      .map(
        member =>

          member === 'GROUP'

            ? '團體 (GROUP)'

            : member

      )
      .join(', ');


  modalVideoMembers.innerHTML = `

    <i
      class="
        fa-regular
        fa-user
        mr-1
      "
    ></i>

    成員:
    ${escapeHtml(
      modalMembers
    )}

  `;


  /*
   * YouTube
   */

  youtubeIframe.src =

    `https://www.youtube-nocookie.com/embed/${encodeURIComponent(
      data.youtubeId
    )}?autoplay=1`;


  modalExternalLink.href =

    `https://www.youtube.com/watch?v=${encodeURIComponent(
      data.youtubeId
    )}`;


  /*
   * Description
   */

  if (
    data.description
  ) {

    modalDescription.textContent =
      data.description;


    modalDescriptionWrapper.classList.remove(
      'hidden'
    );

  } else {

    modalDescriptionWrapper.classList.add(
      'hidden'
    );

  }


  /*
   * Timestamps
   */

  if (

    data.timestamps &&

    data.timestamps.length > 0

  ) {

    modalTimestampsList.innerHTML =

      data.timestamps
        .map(
          ts => `

            <div
              class="
                flex
                items-center
                gap-2.5
                text-slate-300
                hover:text-white
                transition-colors
              "
            >

              <button
                onclick="seekVideo(${Number(ts.seconds)})"
                class="
                  px-2
                  py-0.5
                  rounded
                  bg-indigo-950/80
                  hover:bg-indigo-600
                  text-indigo-400
                  hover:text-white
                  font-mono
                  text-[11px]
                  font-bold
                  border
                  border-indigo-800/50
                  transition-colors
                "
              >

                ${escapeHtml(
                  ts.time
                )}

              </button>


              <span class="text-xs">

                ${escapeHtml(
                  ts.label
                )}

              </span>

            </div>

          `
        )
        .join('');


    modalTimestampsWrapper.classList.remove(
      'hidden'
    );

  } else {

    modalTimestampsWrapper.classList.add(
      'hidden'
    );

  }


  /*
   * Show Modal
   */

  videoModal.classList.remove(
    'hidden'
  );


  setTimeout(
    () => {

      modalContainer.classList.remove(
        'scale-95',
        'opacity-0'
      );

      modalContainer.classList.add(
        'scale-100',
        'opacity-100'
      );

    },
    10
  );


  document.body.style.overflow =
    'hidden';

}



/* =========================================================
   Timestamp Seek
========================================================= */

window.seekVideo =
  function(seconds) {

    if (
      currentActiveYoutubeId
    ) {

      youtubeIframe.src =

        `https://www.youtube-nocookie.com/embed/${encodeURIComponent(
          currentActiveYoutubeId
        )}?autoplay=1&start=${Number(seconds)}`;

    }

  };



/* =========================================================
   Close Modal
========================================================= */

function closeModal() {

  modalContainer.classList.remove(
    'scale-100',
    'opacity-100'
  );

  modalContainer.classList.add(
    'scale-95',
    'opacity-0'
  );


  setTimeout(
    () => {

      videoModal.classList.add(
        'hidden'
      );

      youtubeIframe.src =
        '';

      currentActiveYoutubeId =
        '';

      document.body.style.overflow =
        '';

    },
    200
  );

}



/* =========================================================
   Back To Top
========================================================= */

function setupBackToTop() {

  /*
   * 滑動後才顯示按鈕
   */

  window.addEventListener(
    'scroll',
    () => {

      if (
        window.scrollY > 500
      ) {

        backToTopBtn.classList.remove(
          'opacity-0',
          'invisible',
          'translate-y-3'
        );

        backToTopBtn.classList.add(
          'opacity-100',
          'visible',
          'translate-y-0'
        );

      } else {

        backToTopBtn.classList.add(
          'opacity-0',
          'invisible',
          'translate-y-3'
        );

        backToTopBtn.classList.remove(
          'opacity-100',
          'visible',
          'translate-y-0'
        );

      }

    }
  );


  /*
   * 必須點擊才回到頂端
   */

  backToTopBtn.addEventListener(
    'click',
    () => {

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

    }
  );

}



/* =========================================================
   Event Listeners
========================================================= */

function setupEventListeners() {


  /* =======================================================
     主分類
  ======================================================= */

  document
    .getElementById(
      'mainCategoryNav'
    )
    .addEventListener(
      'click',
      e => {

        const btn =
          e.target.closest(
            '.cat-nav-btn'
          );


        if (!btn) {

          return;

        }


        document
          .querySelectorAll(
            '.cat-nav-btn'
          )
          .forEach(
            b => {

              b.className =

                `
                  cat-nav-btn
                  px-5
                  py-2.5
                  rounded-xl
                  text-xs
                  font-semibold
                  bg-slate-100/90
                  dark:bg-slate-800/90
                  text-slate-600
                  dark:text-slate-300
                  hover:bg-slate-200/70
                  dark:hover:bg-slate-700/70
                  transition-all
                  duration-200
                  flex
                  items-center
                  gap-2
                  whitespace-nowrap
                `;

            }
          );


        btn.className =

          `
            cat-nav-btn
            px-5
            py-2.5
            rounded-xl
            text-xs
            font-bold
            bg-indigo-600
            text-white
            shadow-md
            shadow-indigo-500/20
            transition-all
            duration-200
            flex
            items-center
            gap-2
            whitespace-nowrap
          `;


        currentMainCategory =
          btn.getAttribute(
            'data-cat'
          );


        updateSubFilterUI();

        renderTimeline();

      }
    );



  /* =======================================================
     Search
  ======================================================= */

  const handleSearch =
    e => {

      currentSearchQuery =
        e.target.value.trim();


      clearSearchBtn.classList.toggle(
        'hidden',
        currentSearchQuery === ''
      );


      /*
       * 同步手機 / Desktop
       */

      if (

        e.target === searchInput &&

        searchInputMobile.value !==
          currentSearchQuery

      ) {

        searchInputMobile.value =
          currentSearchQuery;

      }


      if (

        e.target === searchInputMobile &&

        searchInput.value !==
          currentSearchQuery

      ) {

        searchInput.value =
          currentSearchQuery;

      }


      renderTimeline();

    };


  searchInput.addEventListener(
    'input',
    handleSearch
  );


  searchInputMobile.addEventListener(
    'input',
    handleSearch
  );



  /* =======================================================
     Clear Search
  ======================================================= */

  clearSearchBtn.addEventListener(
    'click',
    () => {

      searchInput.value =
        '';

      searchInputMobile.value =
        '';

      currentSearchQuery =
        '';

      clearSearchBtn.classList.add(
        'hidden'
      );

      renderTimeline();

    }
  );



  /* =======================================================
     Subtype
  ======================================================= */

  subtypeSelect.addEventListener(
    'change',
    e => {

      currentSubtype =
        e.target.value;

      renderTimeline();

    }
  );



  /* =======================================================
     Album
  ======================================================= */

  albumSelect.addEventListener(
    'change',
    e => {

      currentAlbum =
        e.target.value;


      /*
       * 換專輯後更新歌曲清單
       */

      updateSongOptions();


      renderTimeline();

    }
  );



  /* =======================================================
     Song
  ======================================================= */

  songSelect.addEventListener(
    'change',
    e => {

      currentSong =
        e.target.value;

      renderTimeline();

    }
  );



  /* =======================================================
     Member
  ======================================================= */

  memberSelect.addEventListener(
    'change',
    e => {

      currentMember =
        e.target.value;

      renderTimeline();

    }
  );



  /* =======================================================
     Sort
  ======================================================= */

  sortSelect.addEventListener(
    'change',
    e => {

      currentSortOrder =
        e.target.value;

      renderTimeline();

    }
  );



  /* =======================================================
     Reset
  ======================================================= */

  resetFilterBtn.addEventListener(
    'click',
    resetAllFilters
  );


  emptyResetBtn.addEventListener(
    'click',
    resetAllFilters
  );



  /* =======================================================
     Modal
  ======================================================= */

  closeModalBtn.addEventListener(
    'click',
    closeModal
  );


  videoModal.addEventListener(
    'click',
    e => {

      if (
        e.target === videoModal
      ) {

        closeModal();

      }

    }
  );



  /* =======================================================
     ESC
  ======================================================= */

  document.addEventListener(
    'keydown',
    e => {

      if (

        e.key === 'Escape' &&

        !videoModal.classList.contains(
          'hidden'
        )

      ) {

        closeModal();

      }

    }
  );

}



/* =========================================================
   Reset All Filters
========================================================= */

function resetAllFilters() {

  currentMainCategory =
    'all';

  currentSearchQuery =
    '';

  currentSubtype =
    'all';

  currentAlbum =
    'all';

  currentSong =
    'all';

  currentMember =
    'all';

  currentSortOrder =
    'desc';


  /*
   * 主分類按鈕
   */

  document
    .querySelectorAll(
      '.cat-nav-btn'
    )
    .forEach(
      b => {

        if (
          b.getAttribute(
            'data-cat'
          ) === 'all'
        ) {

          b.className =

            `
              cat-nav-btn
              px-5
              py-2.5
              rounded-xl
              text-xs
              font-bold
              bg-indigo-600
              text-white
              shadow-md
              shadow-indigo-500/20
              transition-all
              duration-200
              flex
              items-center
              gap-2
              whitespace-nowrap
            `;

        } else {

          b.className =

            `
              cat-nav-btn
              px-5
              py-2.5
              rounded-xl
              text-xs
              font-semibold
              bg-slate-100/90
              dark:bg-slate-800/90
              text-slate-600
              dark:text-slate-300
              hover:bg-slate-200/70
              dark:hover:bg-slate-700/70
              transition-all
              duration-200
              flex
              items-center
              gap-2
              whitespace-nowrap
            `;

        }

      }
    );


  /*
   * UI
   */

  searchInput.value =
    '';

  searchInputMobile.value =
    '';

  subtypeSelect.value =
    'all';

  albumSelect.value =
    'all';

  songSelect.value =
    'all';

  memberSelect.value =
    'all';

  sortSelect.value =
    'desc';


  clearSearchBtn.classList.add(
    'hidden'
  );


  updateSubFilterUI();

  renderTimeline();

}

</script>
