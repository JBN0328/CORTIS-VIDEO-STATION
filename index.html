<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTIS VIDEO STATION</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'Inter',
              '-apple-system',
              'BlinkMacSystemFont',
              'Segoe UI',
              'Roboto',
              'sans-serif'
            ]
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    html {
      scroll-behavior: smooth;
    }

    .modal-backdrop {
      backdrop-filter: blur(8px);
    }

    /* 隱藏月份橫向捲軸，但仍然可以滑動 */
    .month-scroll {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .month-scroll::-webkit-scrollbar {
      display: none;
    }

    /* 避免月份按鈕被壓縮 */
    .month-btn {
      flex: 0 0 auto;
    }
  </style>
</head>


<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">


  <!-- =========================================================
       Header
  ========================================================== -->

  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="flex items-center justify-between h-16 gap-4">

        <!-- Logo -->
        <div class="flex items-center gap-3 shrink-0">

          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/20">
            C
          </div>

          <div>
            <h1 class="font-bold text-lg tracking-tight leading-none text-slate-900 dark:text-white">
              CORTIS VIDEO STATION
            </h1>

            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">
              Video Archive 影音資料庫
            </span>
          </div>

        </div>


        <!-- Desktop Search -->
        <div class="hidden md:flex items-center flex-1 max-w-md mx-4">

          <div class="relative w-full">

            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>

            <input
              type="text"
              id="searchInput"
              placeholder="搜尋影片標題、標籤、關鍵字..."
              class="w-full pl-10 pr-10 py-2 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-full focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:outline-none transition-all placeholder-slate-400"
            >

            <button
              id="clearSearchBtn"
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs"
            >
              <i class="fa-solid fa-circle-xmark"></i>
            </button>

          </div>

        </div>


        <!-- Right -->
        <div class="flex items-center gap-2">

          <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/50">

            <i class="fa-solid fa-film text-[10px]"></i>

            <span id="totalCount">0</span> 筆影音

          </span>


          <button
            id="themeToggleBtn"
            class="p-2.5 rounded-full text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            title="切換主題模式"
          >
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:inline"></i>
          </button>

        </div>

      </div>


      <!-- Mobile Search -->
      <div class="md:hidden pb-3">

        <div class="relative w-full">

          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>

          <input
            type="text"
            id="searchInputMobile"
            placeholder="搜尋影片標題..."
            class="w-full pl-10 pr-10 py-2 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-full focus:ring-2 focus:ring-indigo-500 focus:outline-none placeholder-slate-400"
          >

        </div>

      </div>

    </div>

  </header>



  <!-- =========================================================
       Main Category Navigation
  ========================================================== -->

  <section class="bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">

      <nav
        class="flex items-center gap-2.5 overflow-x-auto pb-1 sm:pb-0"
        id="mainCategoryNav"
      >

        <button
          data-cat="all"
          class="cat-nav-btn active px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >
          <span class="w-3 h-3 rounded-full bg-white/30 flex items-center justify-center text-[8px]">
            <i class="fa-solid fa-border-all"></i>
          </span>
          全部影片
        </button>


        <button
          data-cat="official"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >
          <span class="w-3 h-3 rounded-full bg-rose-500 inline-block shrink-0"></span>
          官方
        </button>


        <button
          data-cat="stage"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >
          <span class="w-3 h-3 rounded-full bg-blue-500 inline-block shrink-0"></span>
          舞台
        </button>


        <button
          data-cat="variety"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >
          <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block shrink-0"></span>
          節目
        </button>


        <button
          data-cat="other"
          class="cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
        >
          <span class="w-3 h-3 rounded-full bg-violet-500 inline-block shrink-0"></span>
          其他
        </button>

      </nav>

    </div>

  </section>



  <!-- =========================================================
       Filter Toolbar
  ========================================================== -->

  <section class="bg-white/60 dark:bg-slate-900/60 border-b border-slate-200/60 dark:border-slate-800/80 sticky top-16 z-20 backdrop-blur-sm py-2.5">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3">

      <!-- Left Filters -->
      <div
        class="flex items-center gap-2 flex-wrap"
        id="subFiltersContainer"
      >

        <!-- Subtype -->
        <div
          id="subtypeFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="subtypeSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >
            <i class="fa-solid fa-layer-group mr-1"></i>
            分類:
          </label>

          <select
            id="subtypeSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >
            <option value="all">全部分類</option>
          </select>

        </div>


        <!-- Album -->
        <div
          id="albumFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="albumSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >
            <i class="fa-solid fa-compact-disc mr-1"></i>
            專輯:
          </label>

          <select
            id="albumSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer max-w-[220px]"
          >
            <option value="all">全部專輯</option>
          </select>

        </div>


        <!-- Song -->
        <div
          id="songFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="songSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >
            <i class="fa-solid fa-music mr-1"></i>
            歌曲:
          </label>

          <select
            id="songSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer max-w-[220px]"
          >
            <option value="all">全部歌曲</option>
          </select>

        </div>

      </div>



      <!-- Right Filters -->
      <div class="flex items-center gap-3 ml-auto flex-wrap">

        <!-- Member -->
        <div class="flex items-center gap-1.5">

          <label
            for="memberSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >
            <i class="fa-solid fa-user-group mr-1"></i>
            成員篩選:
          </label>

          <select
            id="memberSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >
            <option value="all">全部 (ALL)</option>
            <option value="GROUP">團體 (GROUP)</option>
            <option value="JAMES 趙雨凡">JAMES 趙雨凡</option>
            <option value="JUHOON 金主訓">JUHOON 金主訓</option>
            <option value="MARTIN 朴宇宙">MARTIN 朴宇宙</option>
            <option value="SEONGHYEON 嚴成玹">SEONGHYEON 嚴成玹</option>
            <option value="KEONHO 安乾鎬">KEONHO 安乾鎬</option>
          </select>

        </div>


        <!-- Sort -->
        <div class="flex items-center gap-1.5">

          <label
            for="sortSelect"
            class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap"
          >
            <i class="fa-solid fa-sort mr-1"></i>
            排序:
          </label>

          <select
            id="sortSelect"
            class="text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg py-1.5 px-2.5 focus:ring-2 focus:ring-indigo-500 dark:text-slate-200 cursor-pointer"
          >
            <option value="desc">由新到舊</option>
            <option value="asc">由舊到新</option>
          </select>

        </div>

      </div>

    </div>

  </section>



  <!-- =========================================================
       Main
  ========================================================== -->

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">


    <!-- =======================================================
         Timeline Navigation
         同一套元件，桌機與手機都使用
    ======================================================== -->

    <aside
      id="timelineNavigation"
      class="mb-8 bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 shadow-sm"
    >

      <!-- Title -->
      <div class="flex items-center justify-between gap-3 mb-4">

        <h3 class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
          <i class="fa-regular fa-calendar-check mr-1.5"></i>
          時間軸導覽
        </h3>

        <span class="text-[10px] text-slate-400 dark:text-slate-500">
          點年份跳轉 · 滑動月份
        </span>

      </div>


      <!-- Years -->
      <div
        id="yearTimelineNav"
        class="flex items-center gap-2 mb-3"
      ></div>


      <!-- Months -->
      <div
        id="monthTimelineNav"
        class="month-scroll flex items-center gap-2 overflow-x-auto pb-1"
      ></div>

    </aside>



    <!-- =======================================================
         Filter Status
    ======================================================== -->

    <div
      id="filterStatus"
      class="hidden mb-6 p-3 bg-indigo-50/80 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900/40 rounded-xl text-xs text-indigo-700 dark:text-indigo-300 flex items-center justify-between gap-3"
    >

      <span>
        <i class="fa-solid fa-filter mr-1.5"></i>
        已套用篩選條件
      </span>

      <button
        id="resetFilterBtn"
        class="font-semibold underline hover:text-indigo-900 dark:hover:text-indigo-100 whitespace-nowrap"
      >
        重設所有篩選
      </button>

    </div>



    <!-- =======================================================
         Video Timeline
    ======================================================== -->

    <section>

      <div
        id="timelineContainer"
        class="space-y-10"
      ></div>


      <!-- Empty State -->
      <div
        id="emptyState"
        class="hidden text-center py-20 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-800"
      >

        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-2xl">
          <i class="fa-solid fa-ghost"></i>
        </div>

        <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-200">
          找不到符合條件的影音紀錄
        </h3>

        <p class="text-sm text-slate-400 mt-1 max-w-sm mx-auto">
          請嘗試變更搜尋條件或重設篩選。
        </p>

        <button
          id="emptyResetBtn"
          class="mt-4 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition-all"
        >
          重設搜尋條件
        </button>

      </div>

    </section>

  </main>



  <!-- =========================================================
       Back To Top
  ========================================================== -->

  <button
    id="backToTopBtn"
    title="回到最上方"
    class="fixed bottom-5 right-5 z-40 w-11 h-11 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center opacity-0 pointer-events-none translate-y-3 transition-all duration-300"
  >
    <i class="fa-solid fa-arrow-up"></i>
  </button>



  <!-- =========================================================
       Video Modal
  ========================================================== -->

  <div
    id="videoModal"
    class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6 md:p-10 modal-backdrop bg-slate-950/80 overflow-y-auto"
  >

    <div
      id="modalContainer"
      class="relative w-full max-w-4xl bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-slate-800 transform transition-all scale-95 opacity-0 my-auto"
    >

      <!-- Modal Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-900">

        <div class="flex items-center gap-2 overflow-hidden pr-4">

          <span
            id="modalCategoryBadge"
            class="px-2.5 py-0.5 rounded text-xs font-semibold text-white bg-indigo-600 shrink-0"
          >
            影片
          </span>

          <h3
            id="modalVideoTitle"
            class="font-bold text-white text-sm sm:text-base truncate"
          >
            載入中...
          </h3>

        </div>


        <button
          id="closeModalBtn"
          class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors shrink-0"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>


      <!-- Player -->
      <div class="relative w-full aspect-video bg-black">

        <iframe
          id="youtubeIframe"
          class="w-full h-full border-0"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>

      </div>


      <!-- Info -->
      <div class="p-5 max-h-72 overflow-y-auto space-y-4 bg-slate-950 text-xs text-slate-300">

        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800/80 pb-3">

          <div class="flex flex-wrap items-center gap-4 text-slate-400">

            <span id="modalVideoDate">
              <i class="fa-regular fa-calendar mr-1"></i>
            </span>

            <span id="modalVideoMembers">
              <i class="fa-regular fa-user mr-1"></i>
            </span>

          </div>


          <a
            id="modalExternalLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="text-indigo-400 hover:text-indigo-300 font-medium inline-flex items-center gap-1"
          >
            前往 YouTube 觀看
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          </a>

        </div>


        <!-- Description -->
        <div id="modalDescriptionWrapper" class="hidden">

          <h4 class="font-bold text-slate-200 mb-1">
            <i class="fa-solid fa-align-left mr-1.5 text-indigo-400"></i>
            影片說明
          </h4>

          <p
            id="modalDescription"
            class="text-slate-400 leading-relaxed"
          ></p>

        </div>


        <!-- Timestamps -->
        <div id="modalTimestampsWrapper" class="hidden">

          <h4 class="font-bold text-slate-200 mb-2">
            <i class="fa-regular fa-clock mr-1.5 text-indigo-400"></i>
            時間戳記與精彩亮點
          </h4>

          <div
            id="modalTimestampsList"
            class="space-y-1.5 pl-1"
          ></div>

        </div>

      </div>

    </div>

  </div>



  <!-- =========================================================
       JavaScript
  ========================================================== -->

  <script>


    /* =========================================================
       基本設定
    ========================================================== */

    const SUBTYPES = {

      official: [
        "MV",
        "八點檔",
        "練習室"
      ],

      stage: [
        "打歌舞台",
        "電台",
        "安可舞台",
        "專場",
        "大型演出"
      ],

      variety: [
        "訪問",
        "綜藝"
      ],

      other: [
        "花絮",
        "得獎感言"
      ]

    };


    /* =========================================================

    ========================================================== */

    const STAGE_ALBUMS = {

      "COLOR OUTSIDE THE LINES": [

      ]

    /* =========================================================

    ========================================================== */

    const TIMELINE_YEARS = [
      2025,
      2026
    ];


    /* =========================================================
       月份
       12 個月全部預先存在
    ========================================================== */

    const MONTHS = [
      "01",
      "02",
      "03",
      "04",
      "05",
      "06",
      "07",
      "08",
      "09",
      "10",
      "11",
      "12"
    ];


    /* =========================================================
       團體成員
    ========================================================== */

    const GROUP_MEMBERS = [

      "JAMES 趙雨凡",
      "JUHOON 金主訓",
      "MARTIN 朴宇宙",
      "SEONGHYEON 嚴成玹",
      "KEONHO 安乾鎬"

    ];


    /* =========================================================
       State
    ========================================================== */

    let archiveData = [];

    let currentMainCategory = "all";

    let currentSubtype = "all";

    let currentAlbum = "all";

    let currentSong = "all";

    let currentMember = "all";

    let currentSortOrder = "desc";

    let currentSearchQuery = "";

    let currentActiveYoutubeId = "";


    /* =========================================================
       DOM
    ========================================================== */

    const timelineContainer =
      document.getElementById("timelineContainer");

    const yearTimelineNav =
      document.getElementById("yearTimelineNav");

    const monthTimelineNav =
      document.getElementById("monthTimelineNav");


    const searchInput =
      document.getElementById("searchInput");

    const searchInputMobile =
      document.getElementById("searchInputMobile");

    const clearSearchBtn =
      document.getElementById("clearSearchBtn");


    const subtypeFilterWrapper =
      document.getElementById("subtypeFilterWrapper");

    const subtypeSelect =
      document.getElementById("subtypeSelect");


    const albumFilterWrapper =
      document.getElementById("albumFilterWrapper");

    const albumSelect =
      document.getElementById("albumSelect");


    const songFilterWrapper =
      document.getElementById("songFilterWrapper");

    const songSelect =
      document.getElementById("songSelect");


    const memberSelect =
      document.getElementById("memberSelect");

    const sortSelect =
      document.getElementById("sortSelect");


    const totalCountEl =
      document.getElementById("totalCount");


    const emptyState =
      document.getElementById("emptyState");

    const emptyResetBtn =
      document.getElementById("emptyResetBtn");


    const filterStatus =
      document.getElementById("filterStatus");

    const resetFilterBtn =
      document.getElementById("resetFilterBtn");


    const backToTopBtn =
      document.getElementById("backToTopBtn");


    /* =========================================================

    ========================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        initTheme();

        fetchVideoData();

        setupEventListeners();

        updateSubFilterUI();

        renderTimelineNavigation();

      }
    );


    /* =========================================================
       Theme
    ========================================================== */

    function initTheme() {

      const themeToggleBtn =
        document.getElementById("themeToggleBtn");


      if (

        localStorage.theme === "dark" ||

        (
          !("theme" in localStorage) &&
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
        )

      ) {

        document.documentElement.classList.add("dark");

      } else {

        document.documentElement.classList.remove("dark");

      }


      themeToggleBtn.addEventListener(
        "click",
        () => {

          if (
            document.documentElement.classList.contains("dark")
          ) {

            document.documentElement.classList.remove("dark");

            localStorage.theme = "light";

          } else {

            document.documentElement.classList.add("dark");

            localStorage.theme = "dark";

          }

        }
      );

    }


    /* =========================================================
       讀取 video.json
    ========================================================== */

    async function fetchVideoData() {

      try {

        const response =
          await fetch("./video.json");


        if (!response.ok) {

          throw new Error(
            "無法載入 video.json"
          );

        }


        archiveData =
          await response.json();


        /*
         * 相容舊版 members 格式
         */

        archiveData =
          archiveData.map(item => {

            const members =
              Array.isArray(item.members)
                ? item.members
                : [];


            const isFullGroup =
              GROUP_MEMBERS.length === members.length &&
              GROUP_MEMBERS.every(
                member =>
                  members.includes(member)
              );


            if (isFullGroup) {

              return {
                ...item,
                members: ["GROUP"]
              };

            }


            return item;

          });


        renderTimeline();

      } catch (error) {

        console.error(
          "載入失敗:",
          error
        );


        timelineContainer.innerHTML = `

          <div class="text-center py-12 text-rose-500 font-semibold">

            讀取 video.json 失敗，請確認檔案路徑。

          </div>

        `;

      }

    }


    /* =========================================================
       判斷 GROUP
    ========================================================== */

    function isGroupVideo(item) {

      if (
        !item ||
        !Array.isArray(item.members)
      ) {

        return false;

      }


      if (
        item.members.includes("GROUP")
      ) {

        return true;

      }


      return (

        GROUP_MEMBERS.length === item.members.length &&

        GROUP_MEMBERS.every(
          member =>
            item.members.includes(member)
        )

      );

    }


    /* =========================================================
       成員篩選
    ========================================================== */

    function matchesMemberFilter(item) {

      if (
        currentMember === "all"
      ) {

        return true;

      }


      if (
        currentMember === "GROUP"
      ) {

        return isGroupVideo(item);

      }


      return (

        Array.isArray(item.members) &&

        item.members.includes(
          currentMember
        )

      );

    }


    /* =========================================================
       更新專輯選項
    ========================================================== */

    function updateAlbumOptions() {

      albumSelect.innerHTML = `

        <option value="all">
          全部專輯
        </option>

      `;


      Object.keys(STAGE_ALBUMS)
        .forEach(album => {

          albumSelect.innerHTML += `

            <option value="${escapeHTML(album)}">
              ${escapeHTML(album)}
            </option>

          `;

        });


      albumSelect.value =
        currentAlbum === "all"
          ? "all"
          : currentAlbum;

    }


    /* =========================================================
       更新歌曲選項
    ========================================================== */

    function updateSongOptions() {

      let songs = [];


      /*
       * 如果選擇特定專輯
       * 就只顯示該專輯歌曲
       */

      if (
        currentAlbum !== "all" &&
        STAGE_ALBUMS[currentAlbum]
      ) {

        songs =
          STAGE_ALBUMS[currentAlbum];

      } else {

        /*
         * 全部專輯
         * 將所有歌曲合併
         */

        songs =
          Object.values(STAGE_ALBUMS)
            .flat();

      }


      /*
       * 去除重複歌曲
       */

      songs = [
        ...new Set(songs)
      ];


      songSelect.innerHTML = `

        <option value="all">
          全部歌曲
        </option>

      `;


      songs.forEach(song => {

        songSelect.innerHTML += `

          <option value="${escapeHTML(song)}">
            ${escapeHTML(song)}
          </option>

        `;

      });


      /*
       * 如果原本歌曲不在目前專輯
       * 自動回到全部
       */

      if (
        currentSong !== "all" &&
        !songs.includes(currentSong)
      ) {

        currentSong = "all";

      }


      songSelect.value =
        currentSong;

    }


    /* =========================================================
       Sub Filter UI
    ========================================================== */

    function updateSubFilterUI() {

      /*
       * 全部
       */

      if (
        currentMainCategory === "all"
      ) {

        subtypeFilterWrapper.classList.add(
          "hidden"
        );

        subtypeFilterWrapper.classList.remove(
          "flex"
        );


        albumFilterWrapper.classList.add(
          "hidden"
        );

        albumFilterWrapper.classList.remove(
          "flex"
        );


        songFilterWrapper.classList.add(
          "hidden"
        );

        songFilterWrapper.classList.remove(
          "flex"
        );


        return;

      }


      /*
       * 分類
       */

      subtypeFilterWrapper.classList.remove(
        "hidden"
      );

      subtypeFilterWrapper.classList.add(
        "flex"
      );


      const options =
        SUBTYPES[currentMainCategory] || [];


      subtypeSelect.innerHTML =
        `<option value="all">全部分類</option>` +

        options
          .map(
            opt =>
              `<option value="${escapeHTML(opt)}">${escapeHTML(opt)}</option>`
          )
          .join("");


      subtypeSelect.value =
        currentSubtype;


      /*
       * 舞台：
       * 不論選哪一種舞台分類
       * 都顯示「專輯」
       */

      if (
        currentMainCategory === "stage"
      ) {

        albumFilterWrapper.classList.remove(
          "hidden"
        );

        albumFilterWrapper.classList.add(
          "flex"
        );


        songFilterWrapper.classList.remove(
          "hidden"
        );

        songFilterWrapper.classList.add(
          "flex"
        );


        updateAlbumOptions();

        updateSongOptions();

      } else {

        albumFilterWrapper.classList.add(
          "hidden"
        );

        albumFilterWrapper.classList.remove(
          "flex"
        );


        songFilterWrapper.classList.add(
          "hidden"
        );

        songFilterWrapper.classList.remove(
          "flex"
        );

      }

    }


    /* =========================================================
       判斷歌曲
    ========================================================== */

    function matchesSongFilter(item) {

      /*
       * 沒有選歌曲
       */

      if (
        currentSong === "all"
      ) {

        return true;

      }


      /*
       * 新格式：
       *
       * "songs": [
       *   "REDRED",
       *   "ACAI"
       * ]
       */

      if (
        Array.isArray(item.songs)
      ) {

        return item.songs.includes(
          currentSong
        );

      }


      /*
       * 相容舊格式：
       *
       * "song": "REDRED"
       */

      if (
        typeof item.song === "string"
      ) {

        return (
          item.song === currentSong
        );

      }


      return false;

    }


    /* =========================================================
       判斷專輯
    ========================================================== */

    function matchesAlbumFilter(item) {

      if (
        currentAlbum === "all"
      ) {

        return true;

      }


      /*
       * 新格式：
       *
       * "album": "GREENGREEN"
       */

      return (
        item.album === currentAlbum
      );

    }


    /* =========================================================
       取得篩選資料
    ========================================================== */

    function getFilteredData() {

      let filtered =
        archiveData.filter(item => {


          /* 主分類 */

          if (

            currentMainCategory !== "all" &&

            item.category !== currentMainCategory

          ) {

            return false;

          }


          /* 搜尋 */

          if (
            currentSearchQuery !== ""
          ) {

            const q =
              currentSearchQuery.toLowerCase();


            const matchTitle =
              item.title &&
              item.title
                .toLowerCase()
                .includes(q);


            const matchDesc =
              item.description &&
              item.description
                .toLowerCase()
                .includes(q);


            const matchTags =
              Array.isArray(item.tags) &&
              item.tags.some(
                tag =>
                  String(tag)
                    .toLowerCase()
                    .includes(q)
              );


            const matchAlbum =
              item.album &&
              item.album
                .toLowerCase()
                .includes(q);


            const allSongs =
              Array.isArray(item.songs)
                ? item.songs
                : item.song
                  ? [item.song]
                  : [];


            const matchSong =
              allSongs.some(
                song =>
                  String(song)
                    .toLowerCase()
                    .includes(q)
              );


            if (
              !matchTitle &&
              !matchDesc &&
              !matchTags &&
              !matchAlbum &&
              !matchSong
            ) {

              return false;

            }

          }


          /* Subtype */

          if (

            currentSubtype !== "all" &&

            item.subtype !== currentSubtype

          ) {

            return false;

          }


          /* Album */

          if (

            currentMainCategory === "stage" &&

            !matchesAlbumFilter(item)

          ) {

            return false;

          }


          /* Song */

          if (

            currentMainCategory === "stage" &&

            !matchesSongFilter(item)

          ) {

            return false;

          }


          /* Member */

          if (
            !matchesMemberFilter(item)
          ) {

            return false;

          }


          return true;

        });


      /* 日期排序 */

      filtered.sort(
        (a, b) => {

          const dateA =
            new Date(a.date);

          const dateB =
            new Date(b.date);


          return currentSortOrder === "desc"

            ? dateB - dateA

            : dateA - dateB;

        }
      );


      return filtered;

    }


    /* =========================================================

      yearTimelineNav.innerHTML =

          .map(

              <button

                class="year-btn px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all"
              >

          .map(

                data-month="${month}"

                );

                });

      /*
       * 月份事件
       */

      monthTimelineNav
        .querySelectorAll(".month-btn")
        .forEach(btn => {

          btn.addEventListener(
            "click",
            () => {

              const month =
                btn.dataset.month;


              /*
               * 使用目前第一個年份作為
               * 月份導覽的預設年份
               */

              const year =
                getDefaultTimelineYear();


              const target =
                document.getElementById(
                  `month-section-${year}-${month}`
                );


              if (target) {

                target.scrollIntoView({
                  behavior: "smooth",

                });

    /* =========================================================
       預設時間軸年份
    ========================================================== */

    function getDefaultTimelineYear() {

      /*
       * 依目前資料最新年份決定
       */

      if (
        archiveData.length === 0
      ) {

        return TIMELINE_YEARS[
          TIMELINE_YEARS.length - 1
        ];

      }


      const years =
        archiveData
          .map(item =>
            new Date(item.date)
              .getFullYear()
          )
          .filter(year =>
            TIMELINE_YEARS.includes(year)
          );


      if (
        years.length === 0
      ) {

        return TIMELINE_YEARS[
          TIMELINE_YEARS.length - 1
        ];

      }


      return Math.max(...years);

    }


    /* =========================================================
       更新 Timeline Active 狀態
    ========================================================== */

    function updateActiveTimelineButtons() {

      const year =
        getDefaultTimelineYear();


      yearTimelineNav
        .querySelectorAll(".year-btn")
        .forEach(btn => {

          const active =
            Number(btn.dataset.year) === year;


          if (active) {

            btn.className =
              "year-btn px-4 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all";

          } else {

            btn.className =
              "year-btn px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all";

          }

        });

    }


    /* =========================================================
       依年份月份分組
       這裡會固定產生 2025/2026 × 12 個月份
    ========================================================== */

    function buildTimelineStructure(filteredData) {

      const structure = {};


      TIMELINE_YEARS.forEach(year => {

        structure[year] = {};


        MONTHS.forEach(month => {

          structure[year][month] = [];

        });

      });


      filteredData.forEach(item => {

        const date =
          new Date(item.date);


        const year =
          date.getFullYear();


        const month =
          String(
            date.getMonth() + 1
          ).padStart(2, "0");


        if (
          structure[year] &&
          structure[year][month]
        ) {

          structure[year][month].push(item);

        }

      });


      return structure;

    }


    /* =========================================================
       Render Timeline
    ========================================================== */

    function renderTimeline() {

      const filteredData =
        getFilteredData();


      totalCountEl.textContent =
        filteredData.length;


      const isFiltered =

        currentSearchQuery !== "" ||

        currentSubtype !== "all" ||

        currentAlbum !== "all" ||

        currentSong !== "all" ||

        currentMember !== "all" ||

        currentMainCategory !== "all";


      filterStatus.classList.toggle(
        "hidden",
        !isFiltered
      );


      /*
       * 如果篩選後完全沒有資料
       */

      if (
        filteredData.length === 0
      ) {

        timelineContainer.innerHTML = "";

        emptyState.classList.remove(
          "hidden"
        );

        return;

      }


      emptyState.classList.add(
        "hidden"
      );


      const structure =
        buildTimelineStructure(
          filteredData
        );


      let timelineHTML = "";


      TIMELINE_YEARS.forEach(year => {

        /*
         * 年份區塊
         */

        timelineHTML += `

          <section
            id="year-section-${year}"
            class="scroll-mt-36"
          >

            <div class="flex items-center gap-3 mb-4 sticky top-28 z-10 bg-slate-50/90 dark:bg-slate-950/90 backdrop-blur-sm py-2">

              <span class="text-base font-bold tracking-wider text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/80 px-4 py-1.5 rounded-lg border border-indigo-100 dark:border-indigo-900/50">

                ${year} 年

              </span>

              <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>

            </div>

        `;


        /*
         * 12 個月份
         */

        MONTHS.forEach(month => {

          const items =
            structure[year][month];


          timelineHTML += `

            <div
              id="month-section-${year}-${month}"
              class="scroll-mt-36 mb-8"
            >

              <div class="flex items-center gap-3 mb-4">

                <span class="text-sm font-bold tracking-wider text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900 px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-800">

                  ${parseInt(month)} 月

                </span>

                <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>

                <span class="text-xs text-slate-400 font-normal">

                  ${items.length} 則影音

                </span>

              </div>

          `;


          if (
            items.length > 0
          ) {

            timelineHTML += `

              <div class="space-y-4">

                ${items
                  .map(item =>
                    createVideoCardHTML(item)
                  )
                  .join("")}

              </div>

            `;

          } else {

            /*
             * 沒有影片時也保留月份
             */

            timelineHTML += `

              <div class="py-5 px-4 rounded-xl border border-dashed border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400 dark:text-slate-600">

                尚未整理影片

              </div>

            `;

          }


          timelineHTML += `

            </div>

          `;

        });


        timelineHTML += `

          </section>

        `;

      });


      timelineContainer.innerHTML =
        timelineHTML;


      attachCardListeners();

    }

            </div>

          </div>


          <!-- Play -->

          <div class="shrink-0 flex items-center justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 dark:border-slate-800">

            <button
              data-id="${escapeHTML(item.id)}"
              class="open-video-btn w-full sm:w-auto px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition-all flex items-center justify-center gap-2 shadow-sm shadow-indigo-500/20"
            >

              <i class="fa-solid fa-play text-[10px]"></i>

              播放影片

            </button>

          </div>


        </div>

      `;

    }


    /* =========================================================
       Card Event
    ========================================================== */

    function attachCardListeners() {

      document
        .querySelectorAll(".open-video-btn")
        .forEach(btn => {

          btn.addEventListener(
            "click",
            e => {

              const videoId =
                e.currentTarget.getAttribute(
                  "data-id"
                );


              const videoData =
                archiveData.find(
                  video =>
                    String(video.id) ===
                    String(videoId)
                );


              if (videoData) {

                openModal(videoData);

              }

            }
          );

        });

    }


    /* =========================================================
       Open Modal
    ========================================================== */

    function openModal(data) {

      currentActiveYoutubeId =
        data.youtubeId;


      modalVideoTitle.textContent =
        data.title || "";


      modalCategoryBadge.textContent =
        getCategoryLabel(
          data.category
        );


      modalVideoDate.innerHTML = `

        <i class="fa-regular fa-calendar mr-1"></i>

        ${escapeHTML(data.date || "")}

      `;


      /*
       * Members
       */

      const modalMembers =
        (data.members || [])
          .map(
            member =>
              member === "GROUP"
                ? "團體 (GROUP)"
                : member
          )
          .join(", ");


      modalVideoMembers.innerHTML = `

        <i class="fa-regular fa-user mr-1"></i>

        成員: ${escapeHTML(modalMembers)}

      `;


      /*
       * YouTube
       */

      youtubeIframe.src =
        `https://www.youtube-nocookie.com/embed/${data.youtubeId}?autoplay=1`;


      modalExternalLink.href =
        `https://www.youtube.com/watch?v=${data.youtubeId}`;


      /*
       * Description
       */

      if (
        data.description
      ) {

        modalDescription.textContent =
          data.description;

        modalDescriptionWrapper.classList.remove(
          "hidden"
        );

      } else {

        modalDescriptionWrapper.classList.add(
          "hidden"
        );

      }


      /*
       * Timestamps
       */

      if (

        data.timestamps &&

        data.timestamps.length > 0

      ) {

        modalTimestampsList.innerHTML =
          data.timestamps
            .map(ts => `

              <div class="flex items-center gap-2.5 text-slate-300 hover:text-white transition-colors">

                <button
                  onclick="seekVideo(${Number(ts.seconds)})"
                  class="px-2 py-0.5 rounded bg-indigo-950/80 hover:bg-indigo-600 text-indigo-400 hover:text-white font-mono text-[11px] font-bold border border-indigo-800/50 transition-colors"
                >

                  ${escapeHTML(ts.time || "")}

                </button>

                <span class="text-xs">

                  ${escapeHTML(ts.label || "")}

                </span>

              </div>

            `)
            .join("");


        modalTimestampsWrapper.classList.remove(
          "hidden"
        );

      } else {

        modalTimestampsWrapper.classList.add(
          "hidden"
        );

      }


      /*
       * Show
       */

      videoModal.classList.remove(
        "hidden"
      );


      setTimeout(
        () => {

          modalContainer.classList.remove(
            "scale-95",
            "opacity-0"
          );

          modalContainer.classList.add(
            "scale-100",
            "opacity-100"
          );

        },
        10
      );


      document.body.style.overflow =
        "hidden";

    }


    /* =========================================================
       Category Label
    ========================================================== */

    function getCategoryLabel(category) {

      const labels = {

        official: "官方",

        stage: "舞台",

        variety: "節目",

        other: "其他"

      };


      return labels[category] ||
        "影片";

    }


    /* =========================================================
       Timestamp Seek
    ========================================================== */

    window.seekVideo =
      function(seconds) {

        if (
          currentActiveYoutubeId
        ) {

          youtubeIframe.src =
            `https://www.youtube-nocookie.com/embed/${currentActiveYoutubeId}?autoplay=1&start=${seconds}`;

        }

      };


    /* =========================================================
       Close Modal
    ========================================================== */

    function closeModal() {

      modalContainer.classList.remove(
        "scale-100",
        "opacity-100"
      );

      modalContainer.classList.add(
        "scale-95",
        "opacity-0"
      );


      setTimeout(
        () => {

          videoModal.classList.add(
            "hidden"
          );

          youtubeIframe.src = "";

          currentActiveYoutubeId = "";

          document.body.style.overflow = "";

        },
        200
      );

    }


    /* =========================================================
       Event Listeners
    ========================================================== */

    function setupEventListeners() {


      /* =======================================================
         Main Category
      ======================================================== */

      document
        .getElementById("mainCategoryNav")
        .addEventListener(
          "click",
          e => {

            const btn =
              e.target.closest(
                ".cat-nav-btn"
              );


            if (!btn) {
              return;
            }


            document
              .querySelectorAll(
                ".cat-nav-btn"
              )
              .forEach(b => {

                b.className =
                  "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

              });


            btn.className =
              "cat-nav-btn active px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";


            currentMainCategory =
              btn.getAttribute(
                "data-cat"
              );


            /*
             * 切換主分類時
             * 重設舞台專輯 / 歌曲
             */

            currentSubtype = "all";

            currentAlbum = "all";

            currentSong = "all";


            updateSubFilterUI();

            renderTimeline();

          }
        );


      /* =======================================================
         Search
      ======================================================== */

      const handleSearch =
        e => {

          currentSearchQuery =
            e.target.value.trim();


          clearSearchBtn.classList.toggle(
            "hidden",
            currentSearchQuery === ""
          );


          /*
           * 同步桌機 / 手機搜尋
           */

          if (

            e.target === searchInput &&

            searchInputMobile.value !==
              currentSearchQuery

          ) {

            searchInputMobile.value =
              currentSearchQuery;

          }


          if (

            e.target === searchInputMobile &&

            searchInput.value !==
              currentSearchQuery

          ) {

            searchInput.value =
              currentSearchQuery;

          }


          renderTimeline();

        };


      searchInput.addEventListener(
        "input",
        handleSearch
      );


      searchInputMobile.addEventListener(
        "input",
        handleSearch
      );


      /* =======================================================
         Clear Search
      ======================================================== */

      clearSearchBtn.addEventListener(
        "click",
        () => {

          searchInput.value = "";

          searchInputMobile.value = "";

          currentSearchQuery = "";

          clearSearchBtn.classList.add(
            "hidden"
          );

          renderTimeline();

        }
      );


      /* =======================================================
         Subtype
      ======================================================== */

      subtypeSelect.addEventListener(
        "change",
        e => {

          currentSubtype =
            e.target.value;

          renderTimeline();

        }
      );


      /* =======================================================
         Album
      ======================================================== */

      albumSelect.addEventListener(
        "change",
        e => {

          currentAlbum =
            e.target.value;


          /*
           * 換專輯後
           * 更新歌曲清單
           */

          currentSong =
            "all";


          updateSongOptions();

          renderTimeline();

        }
      );


      /* =======================================================
         Song
      ======================================================== */

      songSelect.addEventListener(
        "change",
        e => {

          currentSong =
            e.target.value;

          renderTimeline();

        }
      );


      /* =======================================================
         Member
      ======================================================== */

      memberSelect.addEventListener(
        "change",
        e => {

          currentMember =
            e.target.value;

          renderTimeline();

        }
      );


      /* =======================================================
         Sort
      ======================================================== */

      sortSelect.addEventListener(
        "change",
        e => {

          currentSortOrder =
            e.target.value;

          renderTimeline();

        }
      );


      /* =======================================================
         Reset
      ======================================================== */

      resetFilterBtn.addEventListener(
        "click",
        resetAllFilters
      );


      emptyResetBtn.addEventListener(
        "click",
        resetAllFilters
      );


      /* =======================================================
         Modal
      ======================================================== */

      closeModalBtn.addEventListener(
        "click",
        closeModal
      );


      videoModal.addEventListener(
        "click",
        e => {

          if (
            e.target === videoModal
          ) {

            closeModal();

          }

        }
      );


      /* =======================================================
         ESC
      ======================================================== */

      document.addEventListener(
        "keydown",
        e => {

          if (

            e.key === "Escape" &&

            !videoModal.classList.contains(
              "hidden"
            )

          ) {

            closeModal();

          }

        }
      );


      /* =======================================================
         Back To Top
      ======================================================== */

      window.addEventListener(
        "scroll",
        () => {

          if (
            window.scrollY > 500
          ) {

            backToTopBtn.classList.remove(
              "opacity-0",
              "pointer-events-none",
              "translate-y-3"
            );

            backToTopBtn.classList.add(
              "opacity-100",
              "translate-y-0"
            );

          } else {

            backToTopBtn.classList.add(
              "opacity-0",
              "pointer-events-none",
              "translate-y-3"
            );

            backToTopBtn.classList.remove(
              "opacity-100",
              "translate-y-0"
            );

          }

        }
      );


      backToTopBtn.addEventListener(
        "click",
        () => {

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );

    }


    /* =========================================================
       Reset All
    ========================================================== */

    function resetAllFilters() {

      currentMainCategory = "all";

      currentSearchQuery = "";

      currentSubtype = "all";

      currentAlbum = "all";

      currentSong = "all";

      currentMember = "all";

      currentSortOrder = "desc";


      /*
       * Main Category
       */

      document
        .querySelectorAll(
          ".cat-nav-btn"
        )
        .forEach(btn => {

          if (
            btn.getAttribute(
              "data-cat"
            ) === "all"
          ) {

            btn.className =
              "cat-nav-btn active px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

          } else {

            btn.className =
              "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

          }

        });


      /*
       * UI
       */

      searchInput.value = "";

      searchInputMobile.value = "";

      subtypeSelect.value = "all";

      memberSelect.value = "all";

      sortSelect.value = "desc";


      clearSearchBtn.classList.add(
        "hidden"
      );


      updateSubFilterUI();

      renderTimeline();

    }


    /* =========================================================
       HTML Escape
    ========================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


  </script>

</body>
</html>
