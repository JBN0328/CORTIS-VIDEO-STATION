<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTIS VIDEO STATION</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'Inter',
              '-apple-system',
              'BlinkMacSystemFont',
              'Segoe UI',
              'Roboto',
              'sans-serif'
            ],
          }
        }
      }
    }
  </script>

  <style>
    /* ================================
       Scrollbar
    ================================= */

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      overflow-x: hidden;
    }

    /* ================================
       Modal
    ================================= */

    .modal-backdrop {
      backdrop-filter: blur(8px);
    }

    /* ================================
       Horizontal timeline
    ================================= */

    .timeline-month-scroll {
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }

    .dark .timeline-month-scroll {
      scrollbar-color: #475569 transparent;
    }

    /* ================================
       Hide scrollbar on mobile
       but still allow horizontal swipe
    ================================= */

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* ================================
       Back to top button
    ================================= */

    #backToTopBtn {
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0.2s ease;
    }

    #backToTopBtn.hidden-btn {
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      pointer-events: none;
    }

    #backToTopBtn.show-btn {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ================================
       Select
    ================================= */

    select {
      max-width: 100%;
    }

    /* ================================
       Line clamp
    ================================= */

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>


<body
  class="
    bg-slate-50
    dark:bg-slate-950
    text-slate-800
    dark:text-slate-100
    min-h-screen
    font-sans
    transition-colors
    duration-200
  "
>


  <!-- =========================================================
       Main Header
  ========================================================== -->

  <header
    class="
      sticky
      top-0
      z-30
      bg-white/80
      dark:bg-slate-900/80
      backdrop-blur-md
      border-b
      border-slate-200/80
      dark:border-slate-800
    "
  >

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="flex items-center justify-between h-16 gap-4">

        <!-- Logo -->

        <div class="flex items-center gap-3 shrink-0">

          <div
            class="
              w-10
              h-10
              rounded-xl
              bg-gradient-to-tr
              from-indigo-600
              to-violet-500
              flex
              items-center
              justify-center
              text-white
              font-bold
              text-xl
              shadow-lg
              shadow-indigo-500/20
            "
          >
            C
          </div>

          <div>

            <h1
              class="
                font-bold
                text-lg
                tracking-tight
                leading-none
                text-slate-900
                dark:text-white
              "
            >
              CORTIS VIDEO STATION
            </h1>

            <span
              class="
                text-xs
                text-slate-500
                dark:text-slate-400
                font-medium
              "
            >
              Video Archive 影音資料庫
            </span>

          </div>

        </div>


        <!-- Desktop Search -->

        <div class="hidden md:flex items-center flex-1 max-w-md mx-4">

          <div class="relative w-full">

            <i
              class="
                fa-solid
                fa-magnifying-glass
                absolute
                left-3.5
                top-1/2
                -translate-y-1/2
                text-slate-400
                text-sm
              "
            ></i>

            <input
              type="text"
              id="searchInput"
              placeholder="搜尋影片標題、標籤、關鍵字..."
              class="
                w-full
                pl-10
                pr-10
                py-2
                text-sm
                bg-slate-100
                dark:bg-slate-800
                border-none
                rounded-full
                focus:ring-2
                focus:ring-indigo-500
                focus:outline-none
                placeholder-slate-400
              "
            >

            <button
              id="clearSearchBtn"
              class="
                hidden
                absolute
                right-3
                top-1/2
                -translate-y-1/2
                text-slate-400
                hover:text-slate-600
                dark:hover:text-slate-200
                text-xs
              "
            >
              <i class="fa-solid fa-circle-xmark"></i>
            </button>

          </div>

        </div>


        <!-- Counter / Theme -->

        <div class="flex items-center gap-2">

          <span
            class="
              hidden
              sm:inline-flex
              items-center
              gap-1.5
              px-3
              py-1
              rounded-full
              text-xs
              font-semibold
              bg-indigo-50
              dark:bg-indigo-950/60
              text-indigo-600
              dark:text-indigo-400
              border
              border-indigo-100
              dark:border-indigo-900/50
            "
          >
            <i class="fa-solid fa-film text-[10px]"></i>

            <span id="totalCount">0</span>

            筆影音
          </span>


          <button
            id="themeToggleBtn"
            class="
              p-2.5
              rounded-full
              text-slate-500
              dark:text-slate-400
              hover:bg-slate-100
              dark:hover:bg-slate-800
              transition-colors
            "
            title="切換主題模式"
          >
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:inline"></i>
          </button>

        </div>

      </div>


      <!-- Mobile Search -->

      <div class="md:hidden pb-3">

        <div class="relative w-full">

          <i
            class="
              fa-solid
              fa-magnifying-glass
              absolute
              left-3.5
              top-1/2
              -translate-y-1/2
              text-slate-400
              text-sm
            "
          ></i>

          <input
            type="text"
            id="searchInputMobile"
            placeholder="搜尋影片標題..."
            class="
              w-full
              pl-10
              pr-10
              py-2
              text-sm
              bg-slate-100
              dark:bg-slate-800
              border-none
              rounded-full
              focus:ring-2
              focus:ring-indigo-500
              focus:outline-none
              placeholder-slate-400
            "
          >

        </div>

      </div>

    </div>

  </header>



  <!-- =========================================================
       Main Category Navigation
  ========================================================== -->

  <section
    class="
      bg-white
      dark:bg-slate-900
      border-b
      border-slate-200/80
      dark:border-slate-800
    "
  >

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">

      <nav
        id="mainCategoryNav"
        class="
          flex
          items-center
          gap-2.5
          overflow-x-auto
          pb-1
          sm:pb-0
          hide-scrollbar
        "
      >

        <button
          data-cat="all"
          class="
            cat-nav-btn
            px-5
            py-2.5
            rounded-xl
            text-xs
            font-bold
            bg-indigo-600
            text-white
            shadow-md
            shadow-indigo-500/20
            transition-all
            duration-200
            flex
            items-center
            gap-2
            whitespace-nowrap
          "
        >
          <span
            class="
              w-3
              h-3
              rounded-full
              bg-white/30
              flex
              items-center
              justify-center
              text-[8px]
            "
          >
            <i class="fa-solid fa-border-all"></i>
          </span>

          全部影片
        </button>


        <button
          data-cat="official"
          class="
            cat-nav-btn
            px-5
            py-2.5
            rounded-xl
            text-xs
            font-semibold
            bg-slate-100/90
            dark:bg-slate-800/90
            text-slate-600
            dark:text-slate-300
            hover:bg-slate-200/70
            dark:hover:bg-slate-700/70
            transition-all
            duration-200
            flex
            items-center
            gap-2
            whitespace-nowrap
          "
        >
          <span class="w-3 h-3 rounded-full bg-rose-500"></span>
          官方
        </button>


        <button
          data-cat="stage"
          class="
            cat-nav-btn
            px-5
            py-2.5
            rounded-xl
            text-xs
            font-semibold
            bg-slate-100/90
            dark:bg-slate-800/90
            text-slate-600
            dark:text-slate-300
            hover:bg-slate-200/70
            dark:hover:bg-slate-700/70
            transition-all
            duration-200
            flex
            items-center
            gap-2
            whitespace-nowrap
          "
        >
          <span class="w-3 h-3 rounded-full bg-blue-500"></span>
          舞台
        </button>


        <button
          data-cat="variety"
          class="
            cat-nav-btn
            px-5
            py-2.5
            rounded-xl
            text-xs
            font-semibold
            bg-slate-100/90
            dark:bg-slate-800/90
            text-slate-600
            dark:text-slate-300
            hover:bg-slate-200/70
            dark:hover:bg-slate-700/70
            transition-all
            duration-200
            flex
            items-center
            gap-2
            whitespace-nowrap
          "
        >
          <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
          節目
        </button>


        <button
          data-cat="other"
          class="
            cat-nav-btn
            px-5
            py-2.5
            rounded-xl
            text-xs
            font-semibold
            bg-slate-100/90
            dark:bg-slate-800/90
            text-slate-600
            dark:text-slate-300
            hover:bg-slate-200/70
            dark:hover:bg-slate-700/70
            transition-all
            duration-200
            flex
            items-center
            gap-2
            whitespace-nowrap
          "
        >
          <span class="w-3 h-3 rounded-full bg-violet-500"></span>
          其他
        </button>

      </nav>

    </div>

  </section>



  <!-- =========================================================
       Secondary Filter Toolbar
  ========================================================== -->

  <section
    class="
      bg-white/60
      dark:bg-slate-900/60
      border-b
      border-slate-200/60
      dark:border-slate-800/80
      sticky
      top-16
      z-20
      backdrop-blur-sm
      py-2.5
    "
  >

    <div
      class="
        max-w-7xl
        mx-auto
        px-4
        sm:px-6
        lg:px-8
        flex
        flex-wrap
        items-center
        justify-between
        gap-3
      "
    >

      <!-- Left Filters -->

      <div
        id="subFiltersContainer"
        class="
          flex
          items-center
          gap-2
          flex-wrap
          min-w-0
        "
      >

        <!-- Category -->

        <div
          id="subtypeFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="subtypeSelect"
            class="
              text-xs
              text-slate-500
              dark:text-slate-400
              font-medium
              whitespace-nowrap
            "
          >
            <i class="fa-solid fa-layer-group mr-1"></i>
            分類:
          </label>

          <select
            id="subtypeSelect"
            class="
              text-xs
              bg-slate-100
              dark:bg-slate-800
              border-none
              rounded-lg
              py-1.5
              px-2.5
              focus:ring-2
              focus:ring-indigo-500
              dark:text-slate-200
              cursor-pointer
            "
          >
            <option value="all">全部分類</option>
          </select>

        </div>


        <!-- Album -->

        <div
          id="albumFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="albumSelect"
            class="
              text-xs
              text-slate-500
              dark:text-slate-400
              font-medium
              whitespace-nowrap
            "
          >
            <i class="fa-solid fa-compact-disc mr-1"></i>
            專輯:
          </label>

          <select
            id="albumSelect"
            class="
              text-xs
              bg-slate-100
              dark:bg-slate-800
              border-none
              rounded-lg
              py-1.5
              px-2.5
              focus:ring-2
              focus:ring-indigo-500
              dark:text-slate-200
              cursor-pointer
              max-w-[180px]
            "
          >
            <option value="all">全部專輯</option>
          </select>

        </div>


        <!-- Song -->

        <div
          id="songFilterWrapper"
          class="hidden items-center gap-1.5"
        >

          <label
            for="songSelect"
            class="
              text-xs
              text-slate-500
              dark:text-slate-400
              font-medium
              whitespace-nowrap
            "
          >
            <i class="fa-solid fa-music mr-1"></i>
            歌曲:
          </label>

          <select
            id="songSelect"
            class="
              text-xs
              bg-slate-100
              dark:bg-slate-800
              border-none
              rounded-lg
              py-1.5
              px-2.5
              focus:ring-2
              focus:ring-indigo-500
              dark:text-slate-200
              cursor-pointer
              max-w-[180px]
            "
          >
            <option value="all">全部歌曲</option>
          </select>

        </div>

      </div>


      <!-- Right Controls -->

      <div
        class="
          flex
          items-center
          gap-3
          ml-auto
          flex-wrap
        "
      >

        <!-- Member -->

        <div class="flex items-center gap-1.5">

          <label
            for="memberSelect"
            class="
              text-xs
              text-slate-500
              dark:text-slate-400
              font-medium
              whitespace-nowrap
            "
          >
            <i class="fa-solid fa-user-group mr-1"></i>
            成員篩選:
          </label>

          <select
            id="memberSelect"
            class="
              text-xs
              bg-slate-100
              dark:bg-slate-800
              border-none
              rounded-lg
              py-1.5
              px-2.5
              focus:ring-2
              focus:ring-indigo-500
              dark:text-slate-200
              cursor-pointer
              max-w-[180px]
            "
          >
            <option value="all">全部 (ALL)</option>
            <option value="GROUP">團體 (GROUP)</option>
            <option value="JAMES 趙雨凡">JAMES 趙雨凡</option>
            <option value="JUHOON 金主訓">JUHOON 金主訓</option>
            <option value="MARTIN 朴宇宙">MARTIN 朴宇宙</option>
            <option value="SEONGHYEON 嚴成玹">SEONGHYEON 嚴成玹</option>
            <option value="KEONHO 安乾鎬">KEONHO 安乾鎬</option>
          </select>

        </div>


        <!-- Sort -->

        <div class="flex items-center gap-1.5">

          <label
            for="sortSelect"
            class="
              text-xs
              text-slate-500
              dark:text-slate-400
              font-medium
              whitespace-nowrap
            "
          >
            <i class="fa-solid fa-sort mr-1"></i>
            排序:
          </label>

          <select
            id="sortSelect"
            class="
              text-xs
              bg-slate-100
              dark:bg-slate-800
              border-none
              rounded-lg
              py-1.5
              px-2.5
              focus:ring-2
              focus:ring-indigo-500
              dark:text-slate-200
              cursor-pointer
            "
          >
            <option value="desc">由新到舊</option>
            <option value="asc">由舊到新</option>
          </select>

        </div>

      </div>

    </div>

  </section>



  <!-- =========================================================
       Main
  ========================================================== -->

  <main
    class="
      max-w-7xl
      mx-auto
      px-4
      sm:px-6
      lg:px-8
      py-6
      sm:py-8
    "
  >

    <div class="flex flex-col gap-5">


      <!-- =====================================================
           Timeline Navigation
      ====================================================== -->

      <section
        class="
          bg-white
          dark:bg-slate-900
          border
          border-slate-200/80
          dark:border-slate-800
          rounded-2xl
          shadow-sm
          overflow-hidden
        "
      >

        <div class="px-4 py-3">

          <!-- Timeline Header -->

          <div
            class="
              flex
              items-center
              justify-between
              gap-3
              mb-2.5
            "
          >

            <h3
              class="
                text-xs
                font-semibold
                text-slate-400
                dark:text-slate-500
                uppercase
                tracking-wider
                whitespace-nowrap
              "
            >
              <i class="fa-regular fa-calendar-check mr-1.5"></i>
              時間軸導覽
            </h3>

            <span
              id="timelineHint"
              class="
                text-[10px]
                text-slate-400
                whitespace-nowrap
              "
            >
              可左右滑動月份
            </span>

          </div>


          <!-- Year Navigation -->

          <div
            id="yearTimelineNav"
            class="
              flex
              items-center
              gap-2
              mb-2.5
              overflow-x-auto
              hide-scrollbar
            "
          ></div>


          <!-- Month Navigation -->

          <div
            id="monthTimelineNav"
            class="
              flex
              items-center
              gap-1.5
              overflow-x-auto
              hide-scrollbar
              pb-1
            "
          ></div>

        </div>

      </section>



      <!-- =====================================================
           Filter Status
      ====================================================== -->

      <div
        id="filterStatus"
        class="
          hidden
          p-3
          bg-indigo-50/80
          dark:bg-indigo-950/30
          border
          border-indigo-100
          dark:border-indigo-900/40
          rounded-xl
          text-xs
          text-indigo-700
          dark:text-indigo-300
          flex
          items-center
          justify-between
          gap-3
        "
      >

        <span>
          <i class="fa-solid fa-filter mr-1.5"></i>
          已套用篩選條件
        </span>

        <button
          id="resetFilterBtn"
          class="
            font-semibold
            underline
            hover:text-indigo-900
            dark:hover:text-indigo-100
            whitespace-nowrap
          "
        >
          重設所有篩選
        </button>

      </div>



      <!-- =====================================================
           Video Content
      ====================================================== -->

      <section class="w-full min-w-0">

        <div
          id="timelineContainer"
          class="space-y-10"
        ></div>


        <!-- Empty State -->

        <div
          id="emptyState"
          class="
            hidden
            text-center
            py-20
            bg-white
            dark:bg-slate-900
            rounded-2xl
            border
            border-dashed
            border-slate-300
            dark:border-slate-800
          "
        >

          <div
            class="
              w-16
              h-16
              mx-auto
              mb-4
              rounded-full
              bg-slate-100
              dark:bg-slate-800
              flex
              items-center
              justify-center
              text-slate-400
              text-2xl
            "
          >
            <i class="fa-solid fa-ghost"></i>
          </div>

          <h3
            class="
              text-lg
              font-semibold
              text-slate-700
              dark:text-slate-200
            "
          >
            找不到符合條件的影音紀錄
          </h3>

          <p class="text-sm text-slate-400 mt-1 max-w-sm mx-auto">
            請嘗試變更搜尋條件或重設篩選。
          </p>

          <button
            id="emptyResetBtn"
            class="
              mt-4
              px-4
              py-2
              bg-indigo-600
              hover:bg-indigo-700
              text-white
              rounded-lg
              text-xs
              font-semibold
              transition-all
            "
          >
            重設搜尋條件
          </button>

        </div>

      </section>

    </div>

  </main>



  <!-- =========================================================
       Back To Top
  ========================================================== -->

  <button
    id="backToTopBtn"
    class="
      hidden-btn
      fixed
      right-4
      bottom-5
      sm:right-6
      sm:bottom-6
      z-40
      w-11
      h-11
      rounded-full
      bg-indigo-600
      hover:bg-indigo-700
      text-white
      shadow-lg
      shadow-indigo-500/30
      flex
      items-center
      justify-center
      transition-all
    "
    title="回到最頂端"
    aria-label="回到最頂端"
  >
    <i class="fa-solid fa-arrow-up"></i>
  </button>



  <!-- =========================================================
       Video Modal
  ========================================================== -->

  <div
    id="videoModal"
    class="
      fixed
      inset-0
      z-50
      hidden
      flex
      items-center
      justify-center
      p-4
      sm:p-6
      md:p-10
      modal-backdrop
      bg-slate-950/80
      overflow-y-auto
    "
  >

    <div
      id="modalContainer"
      class="
        relative
        w-full
        max-w-4xl
        bg-slate-900
        rounded-2xl
        overflow-hidden
        shadow-2xl
        border
        border-slate-800
        transform
        transition-all
        scale-95
        opacity-0
        my-auto
      "
    >

      <!-- Modal Header -->

      <div
        class="
          flex
          items-center
          justify-between
          px-5
          py-4
          border-b
          border-slate-800
          bg-slate-900
        "
      >

        <div
          class="
            flex
            items-center
            gap-2
            overflow-hidden
            pr-4
          "
        >

          <span
            id="modalCategoryBadge"

  <!-- =========================================================
       JavaScript
  ========================================================== -->

  <script>

    /* =========================================================
       基本設定
    ========================================================= */

    const SUBTYPES = {

      official: [
        "MV",
        "八點檔",
        "練習室"
      ],

      stage: [
        "打歌舞台",
        "電台",
        "安可舞台",
        "專場",
        "大型演出"
      ],

      variety: [
        "訪問",
        "綜藝"
      ],

      other: [
        "花絮",
        "得獎感言"
      ]

    };


    /* =========================================================
       團體成員
    ========================================================= */

    const GROUP_MEMBERS = [

      "JAMES 趙雨凡",
      "JUHOON 金主訓",
      "MARTIN 朴宇宙",
      "SEONGHYEON 嚴成玹",
      "KEONHO 安乾鎬"

    ];


    /* =========================================================
       全域狀態
    ========================================================= */

    let archiveData = [];

    let currentMainCategory = "all";

    let currentSubtype = "all";

    let currentAlbum = "all";

    let currentSong = "all";

    let currentMember = "all";

    let currentSortOrder = "desc";

    let currentSearchQuery = "";

    let currentActiveYoutubeId = "";

    let currentTimelineYear = null;

    let currentTimelineMonth = null;



    /* =========================================================
       DOM
    ========================================================== */

    const timelineContainer =
      document.getElementById("timelineContainer");

    const yearTimelineNav =
      document.getElementById("yearTimelineNav");

    const monthTimelineNav =
      document.getElementById("monthTimelineNav");

    const searchInput =
      document.getElementById("searchInput");

    const searchInputMobile =
      document.getElementById("searchInputMobile");

    const clearSearchBtn =
      document.getElementById("clearSearchBtn");

    const subtypeFilterWrapper =
      document.getElementById("subtypeFilterWrapper");

    const subtypeSelect =
      document.getElementById("subtypeSelect");

    const albumFilterWrapper =
      document.getElementById("albumFilterWrapper");

    const albumSelect =
      document.getElementById("albumSelect");

    const songFilterWrapper =
      document.getElementById("songFilterWrapper");

    const songSelect =
      document.getElementById("songSelect");

    const memberSelect =
      document.getElementById("memberSelect");

    const sortSelect =
      document.getElementById("sortSelect");

    const totalCountEl =
      document.getElementById("totalCount");

    const emptyState =
      document.getElementById("emptyState");

    const emptyResetBtn =
      document.getElementById("emptyResetBtn");

    const filterStatus =
      document.getElementById("filterStatus");

    const resetFilterBtn =
      document.getElementById("resetFilterBtn");

    const backToTopBtn =
      document.getElementById("backToTopBtn");



    /* =========================================================
       Modal DOM
    ========================================================== */

    const videoModal =
      document.getElementById("videoModal");

    const modalContainer =
      document.getElementById("modalContainer");

    const closeModalBtn =
      document.getElementById("closeModalBtn");

    const youtubeIframe =
      document.getElementById("youtubeIframe");

    const modalCategoryBadge =
      document.getElementById("modalCategoryBadge");

    const modalVideoTitle =
      document.getElementById("modalVideoTitle");

    const modalVideoDate =
      document.getElementById("modalVideoDate");

    const modalVideoMembers =
      document.getElementById("modalVideoMembers");

    const modalExternalLink =
      document.getElementById("modalExternalLink");

    const modalDescriptionWrapper =
      document.getElementById("modalDescriptionWrapper");

    const modalDescription =
      document.getElementById("modalDescription");

    const modalTimestampsWrapper =
      document.getElementById("modalTimestampsWrapper");

    const modalTimestampsList =
      document.getElementById("modalTimestampsList");



    /* =========================================================
       初始化
    ========================================================== */

    document.addEventListener("DOMContentLoaded", () => {

      initTheme();

      fetchVideoData();

      setupEventListeners();

      updateSubFilterUI();

      updateBackToTopButton();

    });



    /* =========================================================
       Theme
    ========================================================== */

    function initTheme() {

      const themeToggleBtn =
        document.getElementById("themeToggleBtn");


      if (

        localStorage.theme === "dark"

        ||

        (

          !("theme" in localStorage)

          &&

          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches

        )

      ) {

        document.documentElement.classList.add("dark");

      } else {

        document.documentElement.classList.remove("dark");

      }


      themeToggleBtn.addEventListener(
        "click",
        () => {

          if (
            document.documentElement.classList.contains("dark")
          ) {

            document.documentElement.classList.remove("dark");

            localStorage.theme = "light";

          } else {

            document.documentElement.classList.add("dark");

            localStorage.theme = "dark";

          }

        }
      );

    }



    /* =========================================================
       Fetch JSON
    ========================================================== */

    async function fetchVideoData() {

      try {

        const response =
          await fetch("./video.json");


        if (!response.ok) {

          throw new Error(
            "無法載入 video.json"
          );

        }


        archiveData =
          await response.json();


        /*
         * GROUP 相容處理
         */

        archiveData =
          archiveData.map(item => {

            const members =
              Array.isArray(item.members)
                ? item.members
                : [];


            const isFullGroup =
              GROUP_MEMBERS.length === members.length
              &&
              GROUP_MEMBERS.every(
                member =>
                  members.includes(member)
              );


            if (isFullGroup) {

              return {
                ...item,
                members: ["GROUP"]
              };

            }


            return item;

          });


        renderTimeline();

      } catch (error) {

        console.error(
          "載入失敗:",
          error
        );


        timelineContainer.innerHTML = `

          <div
            class="
              text-center
              py-12
              text-rose-500
              font-semibold
            "
          >

            讀取 video.json 失敗，
            請確認檔案路徑。

          </div>

        `;

      }

    }



    /* =========================================================
       GROUP 判斷
    ========================================================== */

    function isGroupVideo(item) {

      if (
        !item
        ||
        !Array.isArray(item.members)
      ) {

        return false;

      }


      if (
        item.members.includes("GROUP")
      ) {

        return true;

      }


      return (

        GROUP_MEMBERS.length === item.members.length

        &&

        GROUP_MEMBERS.every(
          member =>
            item.members.includes(member)
        )

      );

    }



    /* =========================================================
       將欄位統一成陣列
       
       舞台歌曲可以：
       
       "song": "REDRED"
       
       或：
       
       "song": [
         "REDRED",
         "ACAI"
       ]
    ========================================================== */

    function normalizeArray(value) {

      if (Array.isArray(value)) {

        return value.filter(Boolean);

      }


      if (
        typeof value === "string"
        &&
        value.trim() !== ""
      ) {

        return [value];

      }


      return [];

    }



    /* =========================================================
       取得歌曲
    ========================================================== */

    function getItemSongs(item) {

      return normalizeArray(
        item.song
      );

    }



    /* =========================================================
       取得專輯
    ========================================================== */

    function getItemAlbum(item) {

      if (
        typeof item.album === "string"
        &&
        item.album.trim() !== ""
      ) {

        return item.album.trim();

      }


      return "";

    }



    /* =========================================================
       Member Filter
    ========================================================== */

    function matchesMemberFilter(item) {

      if (
        currentMember === "all"
      ) {

        return true;

      }


      if (
        currentMember === "GROUP"
      ) {

        return isGroupVideo(item);

      }


      return (

        Array.isArray(item.members)

        &&

        item.members.includes(
          currentMember
        )

      );

    }



    /* =========================================================
       Sub Filter UI
       
       只要選了任何主分類：
       
       分類
       專輯
       歌曲
       
       都可以使用。
    ========================================================== */

    function updateSubFilterUI() {

      currentSubtype = "all";

      currentAlbum = "all";

      currentSong = "all";


      if (
        currentMainCategory === "all"
      ) {

        subtypeFilterWrapper.classList.add(
          "hidden"
        );

        subtypeFilterWrapper.classList.remove(
          "flex"
        );


        albumFilterWrapper.classList.add(
          "hidden"
        );

        albumFilterWrapper.classList.remove(
          "flex"
        );


        songFilterWrapper.classList.add(
          "hidden"
        );

        songFilterWrapper.classList.remove(
          "flex"
        );


        return;

      }


      /* 分類 */

      subtypeFilterWrapper.classList.remove(
        "hidden"
      );

      subtypeFilterWrapper.classList.add(
        "flex"
      );


      const subtypeOptions =
        SUBTYPES[currentMainCategory] || [];


      subtypeSelect.innerHTML =
        `<option value="all">全部分類</option>`

        +

        subtypeOptions
          .map(
            option =>
              `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`
          )
          .join("");


      /*
       * 只顯示目前主分類的專輯
       */

      updateAlbumOptions();


      /*
       * 只顯示目前主分類的歌曲
       */

      updateSongOptions();

    }



    /* =========================================================
       Album Options
    ========================================================== */

    function updateAlbumOptions() {

      if (
        currentMainCategory === "all"
      ) {

        albumFilterWrapper.classList.add(
          "hidden"
        );

        albumFilterWrapper.classList.remove(
          "flex"
        );

        return;

      }


      albumFilterWrapper.classList.remove(
        "hidden"
      );

      albumFilterWrapper.classList.add(
        "flex"
      );


      const albums = [

        ...new Set(

          archiveData

            .filter(
              item =>
                item.category ===
                currentMainCategory
            )

            .map(
              item =>
                getItemAlbum(item)
            )

            .filter(Boolean)

        )

      ];


      albums.sort(
        (a, b) =>
          a.localeCompare(
            b,
            "zh-Hant"
          )
      );


      albumSelect.innerHTML =
        `<option value="all">全部專輯</option>`

        +

        albums
          .map(
            album =>
              `<option value="${escapeHtml(album)}">${escapeHtml(album)}</option>`
          )
          .join("");

    }



    /* =========================================================
       Song Options
       
       一支影片有：
       
       song: ["REDRED", "ACAI"]
       
       兩首都會被加入篩選。
    ========================================================== */

    function updateSongOptions() {

      if (
        currentMainCategory === "all"
      ) {

        songFilterWrapper.classList.add(
          "hidden"
        );

        songFilterWrapper.classList.remove(
          "flex"
        );

        return;

      }


      songFilterWrapper.classList.remove(
        "hidden"
      );

      songFilterWrapper.classList.add(
        "flex"
      );


      const songSet =
        new Set();


      archiveData

        .filter(
          item =>
            item.category ===
            currentMainCategory
        )

        .forEach(item => {

          getItemSongs(item)
            .forEach(song => {

              if (song) {
                songSet.add(song);
              }

            });

        });


      const songs =
        [...songSet].sort(
          (a, b) =>
            a.localeCompare(
              b,
              "en",
              {
                sensitivity: "base"
              }
            )
        );


      songSelect.innerHTML =
        `<option value="all">全部歌曲</option>`

        +

        songs
          .map(
            song =>
              `<option value="${escapeHtml(song)}">${escapeHtml(song)}</option>`
          )
          .join("");

    }



    /* =========================================================
       Filtered Data
    ========================================================== */

    function getFilteredData() {

      let filtered =
        archiveData.filter(item => {


          /* 主分類 */

          if (

            currentMainCategory !== "all"

            &&

            item.category !==
            currentMainCategory

          ) {

            return false;

          }


          /* 搜尋 */

          if (
            currentSearchQuery !== ""
          ) {

            const q =
              currentSearchQuery.toLowerCase();


            const matchTitle =
              item.title
              &&
              item.title
                .toLowerCase()
                .includes(q);


            const matchDesc =
              item.description
              &&
              item.description
                .toLowerCase()
                .includes(q);


            const matchTags =
              Array.isArray(item.tags)
              &&
              item.tags.some(
                tag =>
                  String(tag)
                    .toLowerCase()
                    .includes(q)
              );


            const matchAlbum =
              getItemAlbum(item)
                .toLowerCase()
                .includes(q);


            const matchSongs =
              getItemSongs(item)
                .some(
                  song =>
                    song
                      .toLowerCase()
                      .includes(q)
                );


            if (
              !matchTitle
              &&
              !matchDesc
              &&
              !matchTags
              &&
              !matchAlbum
              &&
              !matchSongs
            ) {

              return false;

            }

          }


          /* 分類 */

          if (

            currentSubtype !== "all"

            &&

            item.subtype !==
            currentSubtype

          ) {

            return false;

          }


          /* 專輯 */

          if (

            currentAlbum !== "all"

            &&

            getItemAlbum(item) !==
            currentAlbum

          ) {

            return false;

          }


          /* 歌曲 */

          if (

            currentSong !== "all"

            &&

            !getItemSongs(item).includes(
              currentSong
            )

          ) {

            return false;

          }


          /* 成員 */

          if (
            !matchesMemberFilter(item)
          ) {

            return false;

          }


          return true;

        });


      /* 日期排序 */

      filtered.sort(
        (a, b) => {

          const dateA =
            new Date(a.date);

          const dateB =
            new Date(b.date);


          return (

            currentSortOrder === "desc"

              ?

            dateB - dateA

              :

            dateA - dateB

          );

        }
      );


      return filtered;

    }



    /* =========================================================
       日期 Key
    ========================================================== */

    function getDateParts(dateString) {

      const dateObj =
        new Date(dateString);


      if (
        Number.isNaN(
          dateObj.getTime()
        )
      ) {

        return null;

      }


      return {

        year:
          dateObj.getFullYear(),

        month:
          String(
            dateObj.getMonth() + 1
          ).padStart(
            2,
            "0"
          )

      };

    }



    /* =========================================================
       Group By Month
    ========================================================== */

    function groupDataByMonth(data) {

      const groups = {};


      data.forEach(item => {

        const parts =
          getDateParts(item.date);


        if (!parts) {
          return;
        }


        const key =
          `${parts.year}.${parts.month}`;


        if (!groups[key]) {

          groups[key] = [];

        }


        groups[key].push(item);

      });


      return groups;

    }



    /* =========================================================
       Timeline
       
       這裡只根據「目前篩選後資料」
       產生有影片的月份。
    ========================================================== */

    function getTimelineGroups() {

      /*
       * 時間軸依照目前所有篩選條件產生。
       *
       * 例如：
       *
       * 舞台 → REDRED
       *
       * 時間軸就只會顯示
       * 有 REDRED 舞台影片的月份。
       */

      const data =
        getFilteredData();


      const groups =
        groupDataByMonth(data);


      return groups;

    }



    /* =========================================================
       Render Timeline Navigation
    ========================================================== */

    function renderTimelineNavigation() {

      const groups =
        getTimelineGroups();


      const keys =
        Object.keys(groups);


      /*
       * 清空
       */

      yearTimelineNav.innerHTML = "";

      monthTimelineNav.innerHTML = "";


      if (
        keys.length === 0
      ) {

        return;

      }


      /*
       * 取得年份
       */

      const years =
        [

          ...new Set(

            keys.map(
              key =>
                key.split(".")[0]
            )

          )

        ];


      years.sort(
        (a, b) =>
          Number(a) - Number(b)
      );


      /*
       * 年份按鈕
       */

      years.forEach(
        (year, index) => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.dataset.year =
            year;


          button.className = `

            timeline-year-btn

            px-3
            py-1.5

            rounded-lg

            text-xs
            font-bold

            transition-all

            whitespace-nowrap

            ${
              index === 0
                ?

              "bg-indigo-600 text-white shadow-sm"

                :

              "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700"
            }

          `;


          button.innerHTML = `

            <i class="fa-regular fa-calendar mr-1"></i>

            ${year}

          `;


          button.addEventListener(
            "click",
            () => {

              jumpToYear(
                Number(year)
              );

            }
          );


          yearTimelineNav.appendChild(
            button
          );

        }
      );


      /*
       * 目前選擇年份
       *
       * 如果之前選的年份不存在，
       * 自動選第一個。
       */

      const availableYears =
        years.map(
          Number
        );


      if (
        !currentTimelineYear
        ||
        !availableYears.includes(
          Number(currentTimelineYear)
        )
      ) {

        currentTimelineYear =
          Number(
            years[0]
          );

      }


      renderMonthButtons(
        groups
      );

    }



    /* =========================================================
       Render Month Buttons
    ========================================================== */

    function renderMonthButtons(
      groups
    ) {

      monthTimelineNav.innerHTML = "";


      const year =
        String(
          currentTimelineYear
        );


      const months =
        Object.keys(groups)

          .filter(
            key =>
              key.startsWith(
                `${year}.`
              )
          )

          .map(
            key =>
              key.split(".")[1]
          )

          .sort(
            (a, b) =>
              Number(a) - Number(b)
          );


      /*
       * 沒有月份
       */

      if (
        months.length === 0
      ) {

        monthTimelineNav.innerHTML = `

          <span
            class="
              text-[11px]
              text-slate-400
              px-2
            "
          >
            此年份目前沒有符合條件的影片
          </span>

        `;

        return;

      }


      /*
       * 如果目前月份不在這個年份
       * 自動選第一個月份
       */

      if (

        !currentTimelineMonth

        ||

        !months.includes(
          String(
            currentTimelineMonth
          ).padStart(2, "0")
        )

      ) {

        currentTimelineMonth =
          months[0];

      }


      months.forEach(
        month => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.dataset.month =
            month;


          const isActive =
            String(
              currentTimelineMonth
            ).padStart(
              2,
              "0"
            ) === month;


          button.className = `

            timeline-month-btn

            shrink-0

            px-3
            py-1.5

            rounded-lg

            text-[11px]

            font-semibold

            whitespace-nowrap

            transition-all

            ${
              isActive

                ?

              "bg-indigo-50 dark:bg-indigo-950/70 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800"

                :

              "bg-slate-50 dark:bg-slate-800/60 text-slate-500 dark:text-slate-400 border border-transparent hover:bg-slate-100 dark:hover:bg-slate-800"
            }

          `;


          button.innerHTML = `

            ${Number(month)} 月

          `;


          button.addEventListener(
            "click",
            () => {

              currentTimelineMonth =
                month;


              updateMonthButtonState();


              jumpToMonth(
                currentTimelineYear,
                month
              );

            }
          );


          monthTimelineNav.appendChild(
            button
          );

        }
      );


      /*
       * 把目前月份滑到可視範圍
       */

      requestAnimationFrame(
        () => {

          const activeButton =
            monthTimelineNav.querySelector(
              ".timeline-month-btn.bg-indigo-50"
            );


          if (activeButton) {

            activeButton.scrollIntoView({
              behavior: "smooth",

    /* =========================================================
       Jump Year
    ========================================================== */

    function jumpToYear(
      year
    ) {

      currentTimelineYear =
        Number(year);


      currentTimelineMonth =
        null;


      updateYearButtonState();


      const groups =
        getTimelineGroups();


      renderMonthButtons(
        groups
      );


      /*
       * 跳到該年份第一個月份
       */

      const firstKey =
        Object.keys(groups)

          .filter(
            key =>
              key.startsWith(
                `${year}.`
              )
          )

          .sort(
            (a, b) =>
              a.localeCompare(b)
          )[0];


      if (!firstKey) {
        return;
      }


      const target =
        document.getElementById(
          `section-${firstKey}`
        );


      if (target) {

        const offset =
          150;


        const top =
          target.getBoundingClientRect().top
          +
          window.scrollY
          -
          offset;


        window.scrollTo({
          top,
          behavior: "smooth"
        });

      }

    }



    /* =========================================================
       Jump Month
    ========================================================== */

    function jumpToMonth(
      year,
      month
    ) {

      const key =
        `${year}.${String(month).padStart(2, "0")}`;


      const target =
        document.getElementById(
          `section-${key}`
        );


      if (!target) {
        return;
      }


      const offset =
        150;


      const top =
        target.getBoundingClientRect().top
        +
        window.scrollY
        -
        offset;


      window.scrollTo({
        top,
        behavior: "smooth"
      });

    }



    /* =========================================================
       Render Timeline
    ========================================================== */

    function renderTimeline() {

      const filteredData =
        getFilteredData();


      totalCountEl.textContent =
        filteredData.length;


      const isFiltered =

        currentSearchQuery !== ""

        ||

        currentSubtype !== "all"

        ||

        currentAlbum !== "all"

        ||

        currentSong !== "all"

        ||

        currentMember !== "all"

        ||

        currentMainCategory !== "all";


      filterStatus.classList.toggle(
        "hidden",
        !isFiltered
      );


      /*
       * Timeline Navigation
       */

      renderTimelineNavigation();


      /*
       * 無資料
       */

      if (
        filteredData.length === 0
      ) {

        timelineContainer.innerHTML = "";

        emptyState.classList.remove(
          "hidden"
        );

        return;

      }


      emptyState.classList.add(
        "hidden"
      );


      const groupedData =
        groupDataByMonth(
          filteredData
        );


      const monthKeys =
        Object.keys(groupedData)
          .sort(
            (a, b) =>
              currentSortOrder === "desc"
                ? b.localeCompare(a)
                : a.localeCompare(b)
          );


      let timelineHTML = "";


      monthKeys.forEach(
        monthKey => {

          const [
            year,
            month
          ] =
            monthKey.split(".");


          const items =
            groupedData[monthKey];


          timelineHTML += `

            <div
              id="section-${monthKey}"
              class="
                scroll-mt-36
              "
            >

              <!-- Month Header -->

              <div
                class="
                  flex
                  items-center
                  gap-3
                  mb-4
                  sticky
                  top-28
                  z-10
                  bg-slate-50/90
                  dark:bg-slate-950/90
                  backdrop-blur-sm
                  py-2
                "
              >

                <span
                  class="
                    text-sm
                    font-bold
                    tracking-wider
                    text-indigo-600
                    dark:text-indigo-400
                    bg-indigo-50
                    dark:bg-indigo-950/80
                    px-3
                    py-1
                    rounded-lg
                    border
                    border-indigo-100
                    dark:border-indigo-900/50
                    whitespace-nowrap
                  "
                >
                  ${year} 年
                  ${parseInt(month)}
                  月
                </span>


                <div
                  class="
                    h-px
                    bg-slate-200
                    dark:bg-slate-800

                  "
                ></div>


                <span

                    text-slate-400

      );


      timelineContainer.innerHTML =
        timelineHTML;


      attachCardListeners();


      /*
       * 更新時間軸目前月份
       * 讓月份按鈕跟著目前第一個月份。
       */

      syncTimelineActiveState();

    /* =========================================================
       Sync Timeline
    ========================================================== */

    function syncTimelineActiveState() {

      const groups =
        getTimelineGroups();


      const keys =
        Object.keys(groups);


      if (
        keys.length === 0
      ) {
        return;
      }


      /*
       * 使用第一個有影片的月份
       */

      const sortedKeys =
        keys.sort(
          (a, b) =>
            currentSortOrder === "desc"
              ? b.localeCompare(a)
              : a.localeCompare(b)
        );


      const first =
        sortedKeys[0];


      const [
        year,
        month
      ] =
        first.split(".");


      /*
       * 如果目前年份不一致，
       * 只更新 UI，不強制跳頁。
       */

      currentTimelineYear =
        Number(year);


      currentTimelineMonth =
        month;


      updateYearButtonState();

      updateMonthButtonState();

    }

    /* =========================================================
       Category Name
    ========================================================== */

    function getCategoryName(
      category
    ) {

      const names = {

        all: "全部",

        official: "官方",

        stage: "舞台",

        variety: "節目",

        other: "其他"

      };


      return (
        names[category]
        ||
        category
        ||
        "影片"
      );

    }



    /* =========================================================
       Escape HTML
    ========================================================== */

    function escapeHtml(
      value
    ) {

      if (
        value === null
        ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

          }
        );



      /* =====================================================
         Search
      ====================================================== */

      const handleSearch =
        event => {

          currentSearchQuery =
            event.target.value.trim();


          clearSearchBtn.classList.toggle(
            "hidden",
            currentSearchQuery === ""
          );


          if (

            event.target === searchInput

            &&

            searchInputMobile.value !==
            currentSearchQuery

          ) {

            searchInputMobile.value =
              currentSearchQuery;

          }


          if (

            event.target === searchInputMobile

            &&

            searchInput.value !==
            currentSearchQuery

          ) {

            searchInput.value =
              currentSearchQuery;

          }


          currentTimelineYear =
            null;

          currentTimelineMonth =
            null;


          renderTimeline();

        };


      searchInput.addEventListener(
        "input",
        handleSearch
      );


      searchInputMobile.addEventListener(
        "input",
        handleSearch
      );



      /* =====================================================
         Clear Search
      ====================================================== */

      clearSearchBtn.addEventListener(
        "click",
        () => {

          searchInput.value =
            "";

          searchInputMobile.value =
            "";

          currentSearchQuery =
            "";

          clearSearchBtn.classList.add(
            "hidden"
          );


          currentTimelineYear =
            null;

          currentTimelineMonth =
            null;


          renderTimeline();

        }
      );



      /* =====================================================
         Subtype
      ====================================================== */

      subtypeSelect.addEventListener(
        "change",
        event => {

          currentSubtype =
            event.target.value;


          currentTimelineYear =
            null;

          currentTimelineMonth =
            null;


          renderTimeline();

        }
      );



      /* =====================================================
         Album
      ====================================================== */

      albumSelect.addEventListener(
        "change",
        event => {

          currentAlbum =
            event.target.value;


          currentTimelineYear =
            null;

          currentTimelineMonth =
            null;


          renderTimeline();

        }
      );



      /* =====================================================
         Song
      ====================================================== */

      songSelect.addEventListener(
        "change",
        event => {

          currentSong =
            event.target.value;


          currentTimelineYear =
            null;

          currentTimelineMonth =
            null;


          renderTimeline();

        }
      );



      /* =====================================================
         Member
      ====================================================== */

      memberSelect.addEventListener(
        "change",
        event => {

          currentMember =
            event.target.value;


          currentTimelineYear =
            null;

          currentTimelineMonth =
            null;


          renderTimeline();

        }
      );



      /* =====================================================
         Sort
      ====================================================== */

      sortSelect.addEventListener(
        "change",
        event => {

          currentSortOrder =
            event.target.value;


          currentTimelineYear =
            null;

          currentTimelineMonth =
            null;


          renderTimeline();

        }
      );



      /* =====================================================
         Reset
      ====================================================== */

      resetFilterBtn.addEventListener(
        "click",
        resetAllFilters
      );


      emptyResetBtn.addEventListener(
        "click",
        resetAllFilters
      );



      /* =====================================================
         Modal
      ====================================================== */

      closeModalBtn.addEventListener(
        "click",
        closeModal
      );


      videoModal.addEventListener(
        "click",
        event => {

          if (
            event.target ===
            videoModal
          ) {

            closeModal();

          }

        }
      );



      /* =====================================================
         ESC
      ====================================================== */

      document.addEventListener(
        "keydown",
        event => {

          if (

            event.key === "Escape"

            &&

            !videoModal.classList.contains(
              "hidden"
            )

          ) {

            closeModal();

          }

        }
      );

    }



    /* =========================================================
       Reset
    ========================================================== */

    function resetAllFilters() {

      currentMainCategory =
        "all";

      currentSearchQuery =
        "";

      currentSubtype =
        "all";

      currentAlbum =
        "all";

      currentSong =
        "all";

      currentMember =
        "all";

      currentSortOrder =
        "desc";

      currentTimelineYear =
        null;

      currentTimelineMonth =
        null;


      /*
       * Main category buttons
       */

      document
        .querySelectorAll(
          ".cat-nav-btn"
        )
        .forEach(
          button => {

            if (

              button.getAttribute(
                "data-cat"
              ) === "all"

            ) {

              button.className =

                "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

            } else {

              button.className =

                "cat-nav-btn px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/70 transition-all duration-200 flex items-center gap-2 whitespace-nowrap";

            }

          }
        );


      /*
       * UI
       */

      searchInput.value =
        "";

      searchInputMobile.value =
        "";

      memberSelect.value =
        "all";

      sortSelect.value =
        "desc";

      clearSearchBtn.classList.add(
        "hidden"
      );


      updateSubFilterUI();

      renderTimeline();

      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }



    /* =========================================================
       自動偵測目前捲動到哪個月份
       
       這樣使用者直接往下滑時，
       上方月份也會跟著變化。
    ========================================================== */

    window.addEventListener(
      "scroll",
      () => {

        const sections =
          document.querySelectorAll(
            '[id^="section-"]'
          );


        if (
          sections.length === 0
        ) {
          return;
        }


        let closestSection =
          null;

        let closestDistance =
          Infinity;


        sections.forEach(
          section => {

            const rect =
              section.getBoundingClientRect();


            const distance =
              Math.abs(
                rect.top - 160
              );


            if (
              distance <
              closestDistance
            ) {

              closestDistance =
                distance;

              closestSection =
                section;

            }

          }
        );


        if (
          !closestSection
        ) {
          return;
        }


        const id =
          closestSection.id
            .replace(
              "section-",
              ""
            );


        const parts =
          id.split(".");


        if (
          parts.length !== 2
        ) {
          return;
        }


        const year =
          Number(
            parts[0]
          );

        const month =
          parts[1];


        if (
          currentTimelineYear !==
          year
        ) {

          currentTimelineYear =
            year;

          updateYearButtonState();

          const groups =
            getTimelineGroups();

          renderMonthButtons(
            groups
          );

        }


        if (
          currentTimelineMonth !==
          month
        ) {

          currentTimelineMonth =
            month;

          updateMonthButtonState();

        }

      },
      {
        passive: true
      }
    );

  </script>

</body>
</html>
